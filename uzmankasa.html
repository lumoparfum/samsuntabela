<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="robots" content="noindex, nofollow">
    <title>Uzman Kasa | Özel Yönetim Paneli</title>
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- jsPDF ve autoTable (Türkçe font eklentisi ile) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <!-- Türkçe font için (arialunicode) -->
    <script src="https://cdn.jsdelivr.net/npm/jspdf-font-arialunicodetable@1.0.0/arialunicode.js"></script>
    <style>
        :root {
            --bg-primary: #050505;
            --bg-secondary: #0c0c10;
            --border-color: #1e1e24;
            --neon: #ccff00;
            --income: #00e676;
            --expense: #ff4444;
            --text-primary: #fff;
            --text-secondary: #aaa;
        }
        [data-theme="light"] {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --border-color: #e0e0e0;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg-primary);
            font-family: 'Inter', Arial, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            transition: background 0.3s, color 0.3s;
        }
        /* Tema butonu */
        .theme-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 8px 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 10px; }

        /* Giriş Ekranı */
        .login-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-primary); display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .login-card {
            background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 40px;
            padding: 40px 30px; width: 90%; max-width: 340px; text-align: center;
        }
        .login-logo { font-size: 2.5rem; font-weight: 900; letter-spacing: -2px; margin-bottom: 30px; color: var(--text-primary); }
        .login-logo span { color: var(--neon); }
        .login-input {
            width: 100%; padding: 14px 18px; background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: 40px; color: var(--text-primary); font-size: 1rem; text-align: center;
            letter-spacing: 2px; margin-bottom: 20px; outline: none;
        }
        .login-input:focus { border-color: var(--neon); }
        .login-btn {
            width: 100%; padding: 12px; background: var(--neon); color: #000;
            font-weight: 800; border: none; border-radius: 40px; font-size: 1rem; cursor: pointer;
        }

        /* Ana Uygulama */
        .app-container { display: none; max-width: 1300px; width: 100%; margin: 0 auto; }
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; margin-bottom: 25px; padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .logo-area h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -1px; color: var(--text-primary); }
        .logo-area span { color: var(--neon); }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .icon-btn {
            background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-secondary);
            padding: 8px 14px; border-radius: 40px; font-weight: 600; font-size: 0.8rem;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
        }
        .icon-btn:hover { border-color: var(--neon); color: var(--neon); }
        .logout-btn:hover { border-color: #ff4444; color: #ff4444; }

        .month-panel {
            background: var(--bg-secondary); border-radius: 50px; padding: 6px 15px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border: 1px solid var(--border-color); flex-wrap: wrap; gap: 10px;
        }
        .month-nav { display: flex; gap: 15px; align-items: center; }
        .month-nav-btn {
            background: transparent; border: none; width: 36px; height: 36px;
            border-radius: 36px; color: var(--text-primary); font-size: 1rem; cursor: pointer;
        }
        .month-nav-btn:hover { background: rgba(204,255,0,0.15); color: var(--neon); }
        .current-month {
            font-size: 1.3rem; font-weight: 800;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .month-select-dropdown {
            background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 30px;
            padding: 6px 16px; color: var(--text-primary); font-weight: 600; cursor: pointer;
        }

        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .kpi-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 24px; padding: 18px; }
        .kpi-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; }
        .kpi-value { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; }
        .income-value { color: var(--income); }
        .expense-value { color: var(--expense); }
        .balance-value { color: var(--neon); }

        .chart-section {
            background: var(--bg-secondary); border-radius: 24px; padding: 16px; margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }
        .section-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 15px; display: flex; gap: 8px; align-items: center; color: var(--text-primary); }
        canvas { max-height: 200px; width: 100% !important; }

        .action-buttons { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .btn-income, .btn-expense, .btn-pdf {
            flex: 1; padding: 12px; border-radius: 50px; font-weight: 800;
            display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem;
            cursor: pointer;
        }
        .btn-income { background: rgba(0,230,118,0.15); color: var(--income); border: 1px solid var(--income); }
        .btn-expense { background: rgba(255,68,68,0.15); color: var(--expense); border: 1px solid var(--expense); }
        .btn-pdf { background: rgba(204,255,0,0.15); color: var(--neon); border: 1px solid var(--neon); }

        .transactions-header { display: flex; justify-content: space-between; margin-bottom: 15px; flex-wrap: wrap; }
        .transaction-list { display: flex; flex-direction: column; gap: 8px; max-height: 450px; overflow-y: auto; }
        .transaction-item {
            background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 20px;
            padding: 12px 16px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .transaction-item.income-trans { background: rgba(0,230,118,0.05); border-left: 3px solid var(--income); }
        .transaction-item.expense-trans { background: rgba(255,68,68,0.05); border-left: 3px solid var(--expense); }
        .trans-detail { flex: 2; }
        .trans-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; color: var(--text-primary); }
        .trans-cat { font-size: 0.65rem; color: var(--text-secondary); background: var(--bg-primary); display: inline-block; padding: 2px 10px; border-radius: 20px; }
        .trans-date { font-size: 0.65rem; color: var(--text-secondary); margin-top: 4px; }
        .trans-amount { font-weight: 800; font-size: 1rem; min-width: 100px; text-align: right; }
        .income-amount { color: var(--income); }
        .expense-amount { color: var(--expense); }
        .delete-trans {
            background: transparent; border: none; color: var(--text-secondary);
            font-size: 1rem; cursor: pointer; padding: 6px; border-radius: 30px;
        }
        .delete-trans:hover { color: var(--expense); background: rgba(255,68,68,0.1); }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-card {
            background: var(--bg-secondary); border-radius: 40px; width: 90%; max-width: 420px;
            padding: 24px; border: 1px solid var(--border-color);
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: 800; font-size: 1.2rem; color: var(--text-primary); }
        .modal-close { cursor: pointer; font-size: 1.3rem; color: var(--text-secondary); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.8rem; color: var(--text-secondary); }
        .form-control {
            width: 100%; padding: 12px 16px; background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: 30px; color: var(--text-primary); font-size: 0.9rem;
        }
        .form-control:focus { outline: none; border-color: var(--neon); }
        .modal-save {
            width: 100%; padding: 12px; background: var(--neon); color: #000;
            border: none; border-radius: 40px; font-weight: 800; cursor: pointer; margin-top: 10px;
        }
        .toast {
            position: fixed; bottom: 20px; right: 20px; background: var(--bg-secondary);
            border-left: 4px solid var(--neon); padding: 10px 20px; border-radius: 40px;
            color: var(--text-primary); font-size: 0.85rem; z-index: 3000; animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 680px) {
            .kpi-grid { grid-template-columns: 1fr; gap: 10px; }
            .month-panel { flex-direction: column; border-radius: 30px; align-items: stretch; }
            .month-nav { justify-content: center; }
            .current-month { font-size: 1.2rem; text-align: center; }
            .action-buttons { flex-direction: column; }
            .kpi-value { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div id="loginContainer" class="login-container">
    <div class="login-card">
        <div class="login-logo">UZMAN<span>KASA</span></div>
        <input type="password" id="pinInput" class="login-input" placeholder="Şifre" autocomplete="off">
        <button class="login-btn" onclick="checkPin()">Giriş Yap</button>
    </div>
</div>

<div id="appContainer" class="app-container">
    <div class="app-header">
        <div class="logo-area"><h1>UZMAN<span>KASA</span></h1></div>
        <div class="header-actions">
            <button class="icon-btn" id="themeToggleBtn"><i class="fas fa-moon"></i> <span>Tema</span></button>
            <button class="icon-btn" onclick="exportToPDF()"><i class="fas fa-file-pdf"></i> PDF Rapor</button>
            <button class="icon-btn logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Çıkış</button>
        </div>
    </div>

    <div class="month-panel">
        <div class="month-nav">
            <button class="month-nav-btn" id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
            <div class="current-month" id="currentMonthDisplay">Haziran 2026</div>
            <button class="month-nav-btn" id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
        </div>
        <select id="monthSelect" class="month-select-dropdown"></select>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-title">Toplam Gelir</div><div class="kpi-value income-value" id="totalIncome">₺0</div></div>
        <div class="kpi-card"><div class="kpi-title">Toplam Gider</div><div class="kpi-value expense-value" id="totalExpense">₺0</div></div>
        <div class="kpi-card"><div class="kpi-title">Net Kasa</div><div class="kpi-value balance-value" id="netBalance">₺0</div></div>
    </div>

    <div class="chart-section">
        <div class="section-title"><i class="fas fa-chart-line" style="color:#ccff00"></i> Aylık Gelir / Gider Grafiği</div>
        <canvas id="monthlyChart" width="400" height="200"></canvas>
    </div>

    <div class="action-buttons">
        <button class="btn-income" onclick="openModal('incomeModal')"><i class="fas fa-plus-circle"></i> Gelir Ekle</button>
        <button class="btn-expense" onclick="openModal('expenseModal')"><i class="fas fa-minus-circle"></i> Gider Ekle</button>
        <button class="btn-pdf" onclick="exportToPDF()"><i class="fas fa-file-pdf"></i> PDF Rapor</button>
    </div>

    <div class="transactions-header">
        <div class="section-title" style="margin-bottom:0"><i class="fas fa-history"></i> İşlem Geçmişi</div>
        <div id="transactionCount" style="color:var(--text-secondary)">0 işlem</div>
    </div>
    <div id="transactionList" class="transaction-list">Yükleniyor...</div>
</div>

<!-- Gelir Modal -->
<div id="incomeModal" class="modal">
    <div class="modal-card">
        <div class="modal-header"><span>Gelir Ekle</span><span class="modal-close" onclick="closeModal('incomeModal')">&times;</span></div>
        <div class="form-group"><label>İş / Müşteri Adı</label><input type="text" id="incomeTitle" class="form-control" placeholder="Örn: Medical Park Totem"></div>
        <div class="form-group"><label>Kategori</label><select id="incomeCat" class="form-control"><option>Tabela İmalatı</option><option>Cephe Giydirme</option><option>Dijital Baskı</option><option>Araç Giydirme</option><option>Fason Kesim</option></select></div>
        <div class="form-group"><label>Tutar (₺)</label><input type="number" id="incomeAmount" class="form-control" placeholder="0"></div>
        <button class="modal-save" onclick="addIncome()">Kaydet</button>
    </div>
</div>

<!-- Gider Modal -->
<div id="expenseModal" class="modal">
    <div class="modal-card">
        <div class="modal-header"><span>Gider Ekle</span><span class="modal-close" onclick="closeModal('expenseModal')">&times;</span></div>
        <div class="form-group"><label>Harcama Açıklaması</label><input type="text" id="expenseTitle" class="form-control" placeholder="Örn: Malzeme Alımı"></div>
        <div class="form-group"><label>Kategori</label><select id="expenseCat" class="form-control"><option>Malzeme Alımı</option><option>Personel Gideri</option><option>Araç Yakıt & Nakliye</option><option>Atölye (Kira/Elektrik)</option><option>Diğer</option></select></div>
        <div class="form-group"><label>Tutar (₺)</label><input type="number" id="expenseAmount" class="form-control" placeholder="0"></div>
        <button class="modal-save" onclick="addExpense()">Kaydet</button>
    </div>
</div>

<!-- Silme Onay Modal -->
<div id="confirmModal" class="modal">
    <div class="modal-card" style="max-width: 380px;">
        <div class="modal-header"><span>İşlemi Sil</span><span class="modal-close" onclick="closeModal('confirmModal')">&times;</span></div>
        <p style="margin-bottom: 20px; color:var(--text-primary)">Bu işlem kalıcı olarak silinecek. Devam etmek istiyor musunuz?</p>
        <button class="modal-save" id="confirmDeleteBtn" style="background:#ff4444; color:white;">Evet, Sil</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAhBlHB0kZRB-IpEIGdHrS7ntzM17YpAWM",
        authDomain: "uzmankasa-94c54.firebaseapp.com",
        projectId: "uzmankasa-94c54",
        storageBucket: "uzmankasa-94c54.firebasestorage.app",
        messagingSenderId: "453163147831",
        appId: "1:453163147831:web:41311f3374b5d95d7115b2"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allTransactions = [];
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let chartInstance = null;
    let deleteId = null;

    // Tema yönetimi
    function initTheme() {
        const saved = localStorage.getItem('uzman_kasa_theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let theme = saved;
        if (!theme) theme = systemDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
        updateThemeIcon();
    }
    function updateThemeIcon() {
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const btn = document.getElementById('themeToggleBtn');
        if (btn) {
            btn.innerHTML = isDark ? '<i class="fas fa-sun"></i> <span>Tema</span>' : '<i class="fas fa-moon"></i> <span>Tema</span>';
        }
    }
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const newTheme = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('uzman_kasa_theme', newTheme);
        updateThemeIcon();
    }
    window.toggleTheme = toggleTheme;
    document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);

    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = isError ? '#ff4444' : '#ccff00';
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    function formatMoney(amount) { return '₺' + amount.toLocaleString('tr-TR'); }

    async function loadData() {
        const q = query(collection(db, "islemler"), orderBy("tarih", "desc"));
        const snap = await getDocs(q);
        allTransactions = [];
        snap.forEach(docSnap => { let data = docSnap.data(); data.id = docSnap.id; allTransactions.push(data); });
        renderCurrentMonth();
        updateChart();
    }

    function getFilteredTransactions() {
        return allTransactions.filter(t => {
            let d = new Date(t.tarih);
            return d.getFullYear() === currentYear && d.getMonth() === currentMonth;
        });
    }

    function renderCurrentMonth() {
        const filtered = getFilteredTransactions();
        let totalInc = 0, totalExp = 0;
        let html = '';
        filtered.forEach(t => {
            if (t.tip === 'gelir') totalInc += t.tutar;
            else totalExp += t.tutar;
            let dateObj = new Date(t.tarih);
            let dateStr = dateObj.toLocaleDateString('tr-TR') + ' ' + dateObj.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
            const transClass = t.tip === 'gelir' ? 'income-trans' : 'expense-trans';
            const amountClass = t.tip === 'gelir' ? 'income-amount' : 'expense-amount';
            const sign = t.tip === 'gelir' ? '+' : '-';
            html += `
                <div class="transaction-item ${transClass}">
                    <div class="trans-detail">
                        <div class="trans-title">${escapeHtml(t.baslik)}</div>
                        <div><span class="trans-cat">${escapeHtml(t.kategori)}</span></div>
                        <div class="trans-date">${dateStr}</div>
                    </div>
                    <div class="trans-amount ${amountClass}">
                        ${sign} ${formatMoney(t.tutar)}
                    </div>
                    <button class="delete-trans" onclick="askDelete('${t.id}')"><i class="fas fa-trash-alt"></i></button>
                </div>
            `;
        });
        document.getElementById('totalIncome').innerHTML = formatMoney(totalInc);
        document.getElementById('totalExpense').innerHTML = formatMoney(totalExp);
        document.getElementById('netBalance').innerHTML = formatMoney(totalInc - totalExp);
        document.getElementById('transactionCount').innerHTML = filtered.length + ' işlem';
        document.getElementById('transactionList').innerHTML = html || '<div style="text-align:center;padding:40px;color:var(--text-secondary)">Bu ayda işlem yok</div>';
        document.getElementById('currentMonthDisplay').innerText = getMonthName(currentYear, currentMonth);
        populateMonthSelect();
    }

    function updateChart() {
        const months = [];
        const incomeData = [];
        const expenseData = [];
        const last6 = getLast6Months();
        for (let i = 0; i < last6.length; i++) {
            const { year, month } = last6[i];
            const filtered = allTransactions.filter(t => {
                let d = new Date(t.tarih);
                return d.getFullYear() === year && d.getMonth() === month;
            });
            let inc = 0, exp = 0;
            filtered.forEach(t => { if(t.tip === 'gelir') inc += t.tutar; else exp += t.tutar; });
            months.push(`${month+1}/${year.toString().slice(-2)}`);
            incomeData.push(inc);
            expenseData.push(exp);
        }
        const ctx = document.getElementById('monthlyChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: { labels: months, datasets: [
                { label: 'Gelir', data: incomeData, backgroundColor: '#00e676', borderRadius: 6 },
                { label: 'Gider', data: expenseData, backgroundColor: '#ff4444', borderRadius: 6 }
            ]},
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: document.documentElement.getAttribute('data-theme') === 'light' ? '#333' : '#fff' } } } }
        });
    }

    function getLast6Months() {
        let result = [];
        let year = currentYear, month = currentMonth;
        for (let i = 0; i < 6; i++) {
            result.unshift({ year, month });
            month--;
            if (month < 0) { month = 11; year--; }
        }
        return result;
    }

    function getMonthName(year, month) {
        const names = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
        return `${names[month]} ${year}`;
    }

    function populateMonthSelect() {
        const select = document.getElementById('monthSelect');
        const available = new Set();
        allTransactions.forEach(t => {
            let d = new Date(t.tarih);
            available.add(`${d.getFullYear()}-${d.getMonth()}`);
        });
        if (available.size === 0) available.add(`${currentYear}-${currentMonth}`);
        let options = Array.from(available).map(key => {
            let [y,m] = key.split('-');
            return { year: parseInt(y), month: parseInt(m), label: getMonthName(parseInt(y), parseInt(m)) };
        }).sort((a,b) => b.year - a.year || b.month - a.month);
        select.innerHTML = '';
        options.forEach(opt => {
            let option = document.createElement('option');
            option.value = `${opt.year}-${opt.month}`;
            option.textContent = opt.label;
            if (opt.year === currentYear && opt.month === currentMonth) option.selected = true;
            select.appendChild(option);
        });
        select.onchange = () => {
            let [y,m] = select.value.split('-');
            currentYear = parseInt(y); currentMonth = parseInt(m);
            renderCurrentMonth();
            updateChart();
        };
    }

    window.changeMonth = (delta) => {
        let newMonth = currentMonth + delta;
        let newYear = currentYear;
        if (newMonth < 0) { newMonth = 11; newYear--; }
        if (newMonth > 11) { newMonth = 0; newYear++; }
        currentYear = newYear; currentMonth = newMonth;
        renderCurrentMonth();
        updateChart();
    };

    window.addIncome = async () => {
        const baslik = document.getElementById('incomeTitle').value.trim();
        const kategori = document.getElementById('incomeCat').value;
        const tutar = parseFloat(document.getElementById('incomeAmount').value);
        if (!baslik || tutar <= 0) { showToast('Lütfen tüm alanları doldurun', true); return; }
        await addDoc(collection(db, "islemler"), { tip: "gelir", baslik, kategori, tutar, tarih: new Date().toISOString() });
        closeModal('incomeModal');
        document.getElementById('incomeTitle').value = '';
        document.getElementById('incomeAmount').value = '';
        await loadData();
        showToast('Gelir eklendi');
    };

    window.addExpense = async () => {
        const baslik = document.getElementById('expenseTitle').value.trim();
        const kategori = document.getElementById('expenseCat').value;
        const tutar = parseFloat(document.getElementById('expenseAmount').value);
        if (!baslik || tutar <= 0) { showToast('Lütfen tüm alanları doldurun', true); return; }
        await addDoc(collection(db, "islemler"), { tip: "gider", baslik, kategori, tutar, tarih: new Date().toISOString() });
        closeModal('expenseModal');
        document.getElementById('expenseTitle').value = '';
        document.getElementById('expenseAmount').value = '';
        await loadData();
        showToast('Gider eklendi');
    };

    window.askDelete = (id) => { deleteId = id; openModal('confirmModal'); };
    document.getElementById('confirmDeleteBtn').onclick = async () => {
        if (deleteId) { await deleteDoc(doc(db, "islemler", deleteId)); await loadData(); showToast('İşlem silindi'); deleteId = null; closeModal('confirmModal'); }
    };

    window.openModal = (id) => document.getElementById(id).style.display = 'flex';
    window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    // PDF RAPOR - TÜRKÇE KARAKTER DESTEKLİ, MODERN TASARIM
    window.exportToPDF = async () => {
        const data = getFilteredTransactions();
        if (data.length === 0) { showToast('Raporlanacak işlem yok', true); return; }
        
        const { jsPDF } = window.jspdf;
        // Türkçe fontu yükle (arialunicode)
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        
        // Başlık
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(18);
        doc.setTextColor(0,0,0);
        doc.text('Uzman Reklam Kasa Raporu', 20, 20);
        doc.setFontSize(12);
        doc.setFont('helvetica', 'normal');
        doc.text(`${getMonthName(currentYear, currentMonth)}`, 20, 30);
        
        let totalInc = 0, totalExp = 0;
        data.forEach(t => { if(t.tip === 'gelir') totalInc += t.tutar; else totalExp += t.tutar; });
        
        const body = data.map(t => {
            const dateObj = new Date(t.tarih);
            const gunler = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
            const gunAdi = gunler[dateObj.getDay()];
            const formattedDate = `${dateObj.toLocaleDateString('tr-TR')} ${gunAdi} ${dateObj.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})}`;
            return [
                formattedDate,
                t.tip === 'gelir' ? 'Gelir' : 'Gider',
                t.baslik,
                t.kategori,
                `${t.tutar.toLocaleString('tr-TR')} TL`
            ];
        });
        
        doc.autoTable({
            head: [['Tarih (Gün & Saat)', 'Tip', 'Başlık', 'Kategori', 'Tutar']],
            body: body,
            startY: 40,
            theme: 'grid',
            headStyles: { fillColor: [204,255,0], textColor: [0,0,0], fontStyle: 'bold', halign: 'center', fontSize: 9 },
            bodyStyles: { textColor: [0,0,0], fontSize: 8, cellPadding: 3 },
            alternateRowStyles: { fillColor: [245,245,245] },
            didParseCell: function(data) {
                if (data.row.section === 'body') {
                    const tip = data.row.raw[1];
                    if (tip === 'Gelir') {
                        data.cell.styles.fillColor = [230,255,230];
                    } else if (tip === 'Gider') {
                        data.cell.styles.fillColor = [255,230,230];
                    }
                }
            },
            foot: [
                [{ content: 'Toplam Gelir', colSpan: 4, styles: { fontStyle: 'bold', fillColor: [240,240,240] } },
                 { content: totalInc.toLocaleString('tr-TR') + ' TL', styles: { fontStyle: 'bold' } }],
                [{ content: 'Toplam Gider', colSpan: 4, styles: { fontStyle: 'bold', fillColor: [240,240,240] } },
                 { content: totalExp.toLocaleString('tr-TR') + ' TL', styles: { fontStyle: 'bold' } }],
                [{ content: 'Net Kasa', colSpan: 4, styles: { fontStyle: 'bold', fillColor: [240,240,240] } },
                 { content: (totalInc - totalExp).toLocaleString('tr-TR') + ' TL', styles: { fontStyle: 'bold' } }]
            ]
        });
        
        doc.save(`kasa_${getMonthName(currentYear, currentMonth)}.pdf`);
        showToast('PDF raporu hazır');
    };

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    window.checkPin = () => {
        const pin = document.getElementById('pinInput').value;
        if(pin === "talha5534") {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            loadData();
        } else { showToast('Hatalı şifre!', true); }
    };
    window.logout = () => {
        document.getElementById('loginContainer').style.display = 'flex';
        document.getElementById('appContainer').style.display = 'none';
        allTransactions = [];
    };
    document.getElementById('prevMonthBtn').onclick = () => changeMonth(-1);
    document.getElementById('nextMonthBtn').onclick = () => changeMonth(1);
    window.onload = () => {
        initTheme();
        document.getElementById('pinInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkPin(); });
    };
</script>
</body>
</html>
