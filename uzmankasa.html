<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="UzmanKasa">
    <title>UzmanKasa</title>
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <!-- Font eklentisi (GitHub'daki font.js dosyanızın yolu) -->
    <script src="font.js"></script>
    <style>
        /* TEMA DEĞİŞKENLERİ - SADECE ARKA PLAN, METİN, BORDER RENKLERİ */
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --border-color: #e9e9ef;
            --header-bg: #ffffff;
            --modal-bg: #ffffff;
            --input-bg: #f9f9fb;
            --shadow: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-strong: 0 20px 40px rgba(0,0,0,0.08);
            --btn-income-bg: #e5f5e8;
            --btn-income-color: #2c6e3c;
            --btn-expense-bg: #ffe8e8;
            --btn-expense-color: #c41e1e;
            --delete-hover-bg: rgba(255,59,48,0.1);
        }
        body.dark {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --border-color: #2c2c2e;
            --header-bg: #1c1c1e;
            --modal-bg: #1c1c1e;
            --input-bg: #2c2c2e;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-strong: 0 20px 40px rgba(0,0,0,0.5);
            --btn-income-bg: #1e3a2a;
            --btn-income-color: #34c759;
            --btn-expense-bg: #3a1e1e;
            --btn-expense-color: #ff5e5e;
            --delete-hover-bg: rgba(255,59,48,0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            transition: background 0.2s, color 0.2s;
        }
        .app-container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: var(--shadow-strong), 0 1px 3px rgba(0,0,0,0.02);
        }
        .app-header {
            padding: 20px 24px 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 0.5px solid var(--border-color);
            background: var(--header-bg);
        }
        .logo-area h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #000, #333);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        body.dark .logo-area h1 {
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo-area span { color: #ccff00; background: none; -webkit-background-clip: unset; background-clip: unset; }
        .header-actions { display: flex; gap: 12px; }
        .icon-btn {
            background: var(--card-bg);
            border: 0.5px solid var(--border-color);
            color: #007aff;
            padding: 8px 16px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .logout-btn { color: #ff3b30; }
        .theme-btn { color: var(--text-primary); }

        .month-panel {
            background: var(--input-bg);
            margin: 16px 24px;
            padding: 8px 12px;
            border-radius: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .month-nav-btn {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 36px;
            color: #007aff;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .current-month { font-size: 1.3rem; font-weight: 600; color: var(--text-primary); }
        .month-select-dropdown {
            background: var(--card-bg);
            border: 0.5px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 16px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
        }
        .kpi-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            box-shadow: var(--shadow);
            border: 0.5px solid var(--border-color);
        }
        .kpi-title { font-size: 0.7rem; text-transform: uppercase; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.5px; margin-bottom: 8px; }
        .kpi-value { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; color: var(--text-primary); }
        .income-value { color: #34c759; }
        .expense-value { color: #ff3b30; }
        .balance-value { color: #007aff; }
        .chart-section {
            background: var(--card-bg);
            margin: 0 24px 24px 24px;
            padding: 16px;
            border-radius: 28px;
            box-shadow: var(--shadow);
            border: 0.5px solid var(--border-color);
        }
        .section-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
        canvas { max-height: 200px; width: 100% !important; }
        .action-buttons { display: flex; gap: 12px; margin: 0 24px 24px 24px; flex-wrap: wrap; }
        .btn-income, .btn-expense { flex: 1; padding: 14px; border-radius: 60px; font-weight: 600; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: 0.2s; }
        .btn-income { background: var(--btn-income-bg); color: var(--btn-income-color); border: none; }
        .btn-expense { background: var(--btn-expense-bg); color: var(--btn-expense-color); border: none; }
        .transactions-header { display: flex; justify-content: space-between; margin: 0 24px 12px 24px; }
        .transaction-list { margin: 0 24px 24px 24px; display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow-y: auto; padding-right: 4px; }
        .transaction-item {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: var(--shadow);
            border: 0.5px solid var(--border-color);
        }
        .transaction-item.income-trans { border-left: 4px solid #34c759; }
        .transaction-item.expense-trans { border-left: 4px solid #ff3b30; }
        .trans-detail { flex: 2; }
        .trans-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; color: var(--text-primary); }
        .trans-cat { font-size: 0.7rem; color: var(--text-secondary); background: var(--input-bg); display: inline-block; padding: 2px 10px; border-radius: 30px; }
        .trans-date { font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; }
        .trans-amount { font-weight: 700; font-size: 1rem; min-width: 100px; text-align: right; }
        .income-amount { color: #34c759; }
        .expense-amount { color: #ff3b30; }
        .delete-trans {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 30px;
        }
        .delete-trans:hover { color: #ff3b30; background: var(--delete-hover-bg); }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-card {
            background: var(--modal-bg);
            border-radius: 36px;
            width: 90%;
            max-width: 400px;
            padding: 28px 24px;
            box-shadow: var(--shadow-strong);
        }
        .modal-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; margin-bottom: 24px; color: var(--text-primary); }
        .modal-close { font-size: 1.5rem; cursor: pointer; color: var(--text-secondary); }
        .form-group { margin-bottom: 20px; }
        .form-group label { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; display: block; }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 0.5px solid var(--border-color);
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            color: var(--text-primary);
        }
        .modal-save {
            width: 100%;
            padding: 14px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 12px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--text-primary);
            color: var(--card-bg);
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            z-index: 3000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 680px) {
            body { padding: 12px; }
            .app-header { padding: 16px; }
            .month-panel { margin: 12px 16px; }
            .kpi-grid { gap: 10px; margin: 0 16px 20px 16px; }
            .kpi-value { font-size: 1.4rem; }
            .action-buttons { margin: 0 16px 20px 16px; }
            .transactions-header { margin: 0 16px 10px 16px; }
            .transaction-list { margin: 0 16px 20px 16px; }
            .chart-section { margin: 0 16px 20px 16px; }
        }
        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-card {
            background: var(--card-bg);
            border-radius: 48px;
            padding: 40px 30px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            box-shadow: var(--shadow-strong);
            border: 0.5px solid var(--border-color);
        }
        .login-logo { font-size: 2.5rem; font-weight: 700; letter-spacing: -1px; margin-bottom: 30px; color: var(--text-primary); }
        .login-logo span { color: #ccff00; }
        .login-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 0.5px solid var(--border-color);
            border-radius: 60px;
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #007aff;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="loginContainer" class="login-container" style="display:flex">
    <div class="login-card">
        <div class="login-logo">UZMAN<span>KASA</span></div>
        <input type="password" id="pinInput" class="login-input" placeholder="Şifre" autocomplete="off">
        <button class="login-btn" onclick="checkPin()">Giriş Yap</button>
    </div>
</div>

<div id="appContainer" class="app-container" style="display:none">
    <div class="app-header">
        <div class="logo-area"><h1>UZMAN<span>KASA</span></h1></div>
        <div class="header-actions">
            <button class="icon-btn theme-btn" id="themeToggleBtn"><i class="fas fa-moon"></i> Tema</button>
            <button class="icon-btn" onclick="exportToPDF()"><i class="fas fa-file-pdf"></i> PDF Rapor</button>
            <button class="icon-btn logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Çıkış</button>
        </div>
    </div>

    <div class="month-panel">
        <div class="month-nav">
            <button class="month-nav-btn" id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
            <div class="current-month" id="currentMonthDisplay">Haziran 2026</div>
            <button class="month-nav-btn" id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
        </div>
        <select id="monthSelect" class="month-select-dropdown"></select>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-title">Toplam Gelir</div><div class="kpi-value income-value" id="totalIncome">₺0</div></div>
        <div class="kpi-card"><div class="kpi-title">Toplam Gider</div><div class="kpi-value expense-value" id="totalExpense">₺0</div></div>
        <div class="kpi-card"><div class="kpi-title">Net Kasa</div><div class="kpi-value balance-value" id="netBalance">₺0</div></div>
    </div>

    <div class="chart-section">
        <div class="section-title"><i class="fas fa-chart-line" style="color:#007aff"></i> Aylık Gelir / Gider</div>
        <canvas id="monthlyChart" width="400" height="200"></canvas>
    </div>

    <div class="action-buttons">
        <button class="btn-income" onclick="openModal('incomeModal')"><i class="fas fa-plus-circle"></i> Gelir Ekle</button>
        <button class="btn-expense" onclick="openModal('expenseModal')"><i class="fas fa-minus-circle"></i> Gider Ekle</button>
    </div>

    <div class="transactions-header">
        <div class="section-title" style="margin:0">İşlem Geçmişi</div>
        <div id="transactionCount" style="color:var(--text-secondary)">0 işlem</div>
    </div>
    <div id="transactionList" class="transaction-list">Yükleniyor...</div>
</div>

<!-- Gelir Modal -->
<div id="incomeModal" class="modal">
    <div class="modal-card">
        <div class="modal-header"><span>Gelir Ekle</span><span class="modal-close" onclick="closeModal('incomeModal')">&times;</span></div>
        <div class="form-group"><label>İş / Müşteri Adı</label><input type="text" id="incomeTitle" class="form-control" placeholder="Örn: Medical Park Totem"></div>
        <div class="form-group"><label>Kategori</label><select id="incomeCat" class="form-control"><option>Tabela İmalatı</option><option>Cephe Giydirme</option><option>Dijital Baskı</option><option>Araç Giydirme</option><option>Fason Kesim</option></select></div>
        <div class="form-group"><label>Tutar (₺)</label><input type="number" id="incomeAmount" class="form-control" placeholder="0"></div>
        <button class="modal-save" onclick="addIncome()">Kaydet</button>
    </div>
</div>

<!-- Gider Modal -->
<div id="expenseModal" class="modal">
    <div class="modal-card">
        <div class="modal-header"><span>Gider Ekle</span><span class="modal-close" onclick="closeModal('expenseModal')">&times;</span></div>
        <div class="form-group"><label>Harcama Açıklaması</label><input type="text" id="expenseTitle" class="form-control" placeholder="Örn: Malzeme Alımı"></div>
        <div class="form-group"><label>Kategori</label><select id="expenseCat" class="form-control"><option>Malzeme Alımı</option><option>Personel Gideri</option><option>Araç Yakıt & Nakliye</option><option>Atölye (Kira/Elektrik)</option><option>Diğer</option></select></div>
        <div class="form-group"><label>Tutar (₺)</label><input type="number" id="expenseAmount" class="form-control" placeholder="0"></div>
        <button class="modal-save" onclick="addExpense()">Kaydet</button>
    </div>
</div>

<!-- Silme Onay Modal -->
<div id="confirmModal" class="modal">
    <div class="modal-card" style="max-width:360px">
        <div class="modal-header"><span>İşlemi Sil</span><span class="modal-close" onclick="closeModal('confirmModal')">&times;</span></div>
        <p style="margin-bottom:24px; color:var(--text-primary)">Bu işlem kalıcı olarak silinecek. Devam etmek istiyor musunuz?</p>
        <button class="modal-save" id="confirmDeleteBtn" style="background:#ff3b30">Evet, Sil</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAhBlHB0kZRB-IpEIGdHrS7ntzM17YpAWM",
        authDomain: "uzmankasa-94c54.firebaseapp.com",
        projectId: "uzmankasa-94c54",
        storageBucket: "uzmankasa-94c54.firebasestorage.app",
        messagingSenderId: "453163147831",
        appId: "1:453163147831:web:41311f3374b5d95d7115b2"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allTransactions = [];
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let chartInstance = null;
    let deleteId = null;

    // Tema yönetimi (sadece body sınıfını ve localStorage'ı değiştir)
    function setTheme(theme) {
        if (theme === 'dark') {
            document.body.classList.add('dark');
            localStorage.setItem('uzmanTheme', 'dark');
            document.getElementById('themeToggleBtn').innerHTML = '<i class="fas fa-sun"></i> Tema';
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('uzmanTheme', 'light');
            document.getElementById('themeToggleBtn').innerHTML = '<i class="fas fa-moon"></i> Tema';
        }
        // Chart renklerini güncelle (sadece grid ve yazı renkleri)
        if (chartInstance) {
            const isDark = theme === 'dark';
            chartInstance.options.plugins.legend.labels.color = isDark ? '#ffffff' : '#1c1c1e';
            if (chartInstance.options.scales) {
                if (chartInstance.options.scales.x) {
                    chartInstance.options.scales.x.grid.color = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
                    chartInstance.options.scales.x.ticks.color = isDark ? '#ffffff' : '#1c1c1e';
                }
                if (chartInstance.options.scales.y) {
                    chartInstance.options.scales.y.grid.color = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
                    chartInstance.options.scales.y.ticks.color = isDark ? '#ffffff' : '#1c1c1e';
                }
            }
            chartInstance.update();
        }
    }
    function initTheme() {
        const saved = localStorage.getItem('uzmanTheme');
        if (saved) {
            setTheme(saved);
        } else {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(prefersDark ? 'dark' : 'light');
        }
    }
    window.toggleTheme = () => {
        const isDark = document.body.classList.contains('dark');
        setTheme(isDark ? 'light' : 'dark');
    };
    document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);

    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = isError ? '#ff3b30' : 'var(--text-primary)';
        toast.style.color = 'var(--card-bg)';
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    function formatMoney(amount) { return '₺' + amount.toLocaleString('tr-TR'); }

    async function loadData() {
        const q = query(collection(db, "islemler"), orderBy("tarih", "desc"));
        const snap = await getDocs(q);
        allTransactions = [];
        snap.forEach(docSnap => { let data = docSnap.data(); data.id = docSnap.id; allTransactions.push(data); });
        renderCurrentMonth();
        updateChart();
    }

    function getFilteredTransactions() {
        return allTransactions.filter(t => {
            let d = new Date(t.tarih);
            return d.getFullYear() === currentYear && d.getMonth() === currentMonth;
        });
    }

    function renderCurrentMonth() {
        const filtered = getFilteredTransactions();
        let totalInc = 0, totalExp = 0;
        let html = '';
        filtered.forEach(t => {
            if (t.tip === 'gelir') totalInc += t.tutar;
            else totalExp += t.tutar;
            let dateObj = new Date(t.tarih);
            let dateStr = dateObj.toLocaleDateString('tr-TR') + ' ' + dateObj.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
            const transClass = t.tip === 'gelir' ? 'income-trans' : 'expense-trans';
            const amountClass = t.tip === 'gelir' ? 'income-amount' : 'expense-amount';
            const sign = t.tip === 'gelir' ? '+' : '-';
            html += `
                <div class="transaction-item ${transClass}">
                    <div class="trans-detail">
                        <div class="trans-title">${escapeHtml(t.baslik)}</div>
                        <div><span class="trans-cat">${escapeHtml(t.kategori)}</span></div>
                        <div class="trans-date">${dateStr}</div>
                    </div>
                    <div class="trans-amount ${amountClass}">
                        ${sign} ${formatMoney(t.tutar)}
                    </div>
                    <button class="delete-trans" onclick="askDelete('${t.id}')"><i class="fas fa-trash-alt"></i></button>
                </div>
            `;
        });
        document.getElementById('totalIncome').innerHTML = formatMoney(totalInc);
        document.getElementById('totalExpense').innerHTML = formatMoney(totalExp);
        document.getElementById('netBalance').innerHTML = formatMoney(totalInc - totalExp);
        document.getElementById('transactionCount').innerHTML = filtered.length + ' işlem';
        document.getElementById('transactionList').innerHTML = html || '<div style="text-align:center;padding:40px;color:var(--text-secondary)">Bu ayda işlem yok</div>';
        document.getElementById('currentMonthDisplay').innerText = getMonthName(currentYear, currentMonth);
        populateMonthSelect();
    }

    function updateChart() {
        const months = [];
        const incomeData = [];
        const expenseData = [];
        const last6 = getLast6Months();
        for (let i = 0; i < last6.length; i++) {
            const { year, month } = last6[i];
            const filtered = allTransactions.filter(t => {
                let d = new Date(t.tarih);
                return d.getFullYear() === year && d.getMonth() === month;
            });
            let inc = 0, exp = 0;
            filtered.forEach(t => { if(t.tip === 'gelir') inc += t.tutar; else exp += t.tutar; });
            months.push(`${month+1}/${year.toString().slice(-2)}`);
            incomeData.push(inc);
            expenseData.push(exp);
        }
        const ctx = document.getElementById('monthlyChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        const isDark = document.body.classList.contains('dark');
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: { labels: months, datasets: [
                { label: 'Gelir', data: incomeData, backgroundColor: '#34c759', borderRadius: 8 },
                { label: 'Gider', data: expenseData, backgroundColor: '#ff3b30', borderRadius: 8 }
            ]},
            options: { 
                responsive: true, 
                maintainAspectRatio: true, 
                plugins: { 
                    legend: { labels: { color: isDark ? '#ffffff' : '#1c1c1e', font: { weight: '500' } } } 
                },
                scales: {
                    x: { grid: { color: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)' }, ticks: { color: isDark ? '#ffffff' : '#1c1c1e' } },
                    y: { grid: { color: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)' }, ticks: { color: isDark ? '#ffffff' : '#1c1c1e' } }
                }
            }
        });
    }

    function getLast6Months() {
        let result = [];
        let year = currentYear, month = currentMonth;
        for (let i = 0; i < 6; i++) {
            result.unshift({ year, month });
            month--;
            if (month < 0) { month = 11; year--; }
        }
        return result;
    }

    function getMonthName(year, month) {
        const names = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
        return `${names[month]} ${year}`;
    }

    function populateMonthSelect() {
        const select = document.getElementById('monthSelect');
        const available = new Set();
        allTransactions.forEach(t => {
            let d = new Date(t.tarih);
            available.add(`${d.getFullYear()}-${d.getMonth()}`);
        });
        if (available.size === 0) available.add(`${currentYear}-${currentMonth}`);
        let options = Array.from(available).map(key => {
            let [y,m] = key.split('-');
            return { year: parseInt(y), month: parseInt(m), label: getMonthName(parseInt(y), parseInt(m)) };
        }).sort((a,b) => b.year - a.year || b.month - a.month);
        select.innerHTML = '';
        options.forEach(opt => {
            let option = document.createElement('option');
            option.value = `${opt.year}-${opt.month}`;
            option.textContent = opt.label;
            if (opt.year === currentYear && opt.month === currentMonth) option.selected = true;
            select.appendChild(option);
        });
        select.onchange = () => {
            let [y,m] = select.value.split('-');
            currentYear = parseInt(y); currentMonth = parseInt(m);
            renderCurrentMonth();
            updateChart();
        };
    }

    window.changeMonth = (delta) => {
        let newMonth = currentMonth + delta;
        let newYear = currentYear;
        if (newMonth < 0) { newMonth = 11; newYear--; }
        if (newMonth > 11) { newMonth = 0; newYear++; }
        currentYear = newYear; currentMonth = newMonth;
        renderCurrentMonth();
        updateChart();
    };

    window.addIncome = async () => {
        const baslik = document.getElementById('incomeTitle').value.trim();
        const kategori = document.getElementById('incomeCat').value;
        const tutar = parseFloat(document.getElementById('incomeAmount').value);
        if (!baslik || tutar <= 0) { showToast('Lütfen tüm alanları doldurun', true); return; }
        await addDoc(collection(db, "islemler"), { tip: "gelir", baslik, kategori, tutar, tarih: new Date().toISOString() });
        closeModal('incomeModal');
        document.getElementById('incomeTitle').value = '';
        document.getElementById('incomeAmount').value = '';
        await loadData();
        showToast('Gelir eklendi');
    };

    window.addExpense = async () => {
        const baslik = document.getElementById('expenseTitle').value.trim();
        const kategori = document.getElementById('expenseCat').value;
        const tutar = parseFloat(document.getElementById('expenseAmount').value);
        if (!baslik || tutar <= 0) { showToast('Lütfen tüm alanları doldurun', true); return; }
        await addDoc(collection(db, "islemler"), { tip: "gider", baslik, kategori, tutar, tarih: new Date().toISOString() });
        closeModal('expenseModal');
        document.getElementById('expenseTitle').value = '';
        document.getElementById('expenseAmount').value = '';
        await loadData();
        showToast('Gider eklendi');
    };

    window.askDelete = (id) => { deleteId = id; openModal('confirmModal'); };
    document.getElementById('confirmDeleteBtn').onclick = async () => {
        if (deleteId) { await deleteDoc(doc(db, "islemler", deleteId)); await loadData(); showToast('İşlem silindi'); deleteId = null; closeModal('confirmModal'); }
    };

    window.openModal = (id) => document.getElementById(id).style.display = 'flex';
    window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    // PDF EXPORT – Özel font kullanımı
    window.exportToPDF = () => {
        const data = getFilteredTransactions();
        if (data.length === 0) { showToast('Raporlanacak işlem yok', true); return; }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        // Özel fontu ekle ve kullan (font.js içindeki font adı 'NotoSans-SemiBold')
        try {
            doc.addFont('NotoSans-SemiBold-normal.ttf', 'NotoSans-SemiBold', 'normal');
            doc.setFont('NotoSans-SemiBold');
        } catch(e) { console.warn("Font yüklenemedi, standart font kullanılacak", e); }
        doc.setFontSize(16);
        doc.setTextColor(28, 28, 30);
        doc.text(`Uzman Reklam Kasa Raporu`, 15, 15);
        doc.setFontSize(11);
        doc.text(`${getMonthName(currentYear, currentMonth)}`, 15, 23);
        
        let totalInc = 0, totalExp = 0;
        data.forEach(t => { if(t.tip === 'gelir') totalInc += t.tutar; else totalExp += t.tutar; });
        
        const body = data.map(t => {
            let dateObj = new Date(t.tarih);
            const gunler = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
            const gunAdi = gunler[dateObj.getDay()];
            const tarihFormat = dateObj.toLocaleDateString('tr-TR') + ' ' + gunAdi + ' ' + dateObj.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
            return [
                tarihFormat,
                t.tip === 'gelir' ? 'Gelir' : 'Gider',
                t.baslik,
                t.kategori,
                t.tutar.toLocaleString('tr-TR') + ' TL'
            ];
        });
        
        doc.autoTable({
            head: [['Tarih (Gün & Saat)', 'Tip', 'Başlık', 'Kategori', 'Tutar']],
            body: body,
            startY: 30,
            theme: 'grid',
            headStyles: { fillColor: [0,122,255], textColor: [255,255,255], fontStyle: 'bold', halign: 'center', fontSize: 10 },
            bodyStyles: { fontSize: 9, textColor: [0,0,0] },
            alternateRowStyles: { fillColor: [248,248,250] },
            didParseCell: function(data) {
                if (data.row.section === 'body') {
                    const tip = data.row.raw[1];
                    if (tip === 'Gelir') {
                        data.cell.styles.fillColor = [230,255,230];
                    } else if (tip === 'Gider') {
                        data.cell.styles.fillColor = [255,230,230];
                    }
                }
            },
            foot: [
                [{ content: 'Toplam Gelir', colSpan: 4, styles: { fontStyle: 'bold', fillColor: [240,240,240] } },
                 { content: totalInc.toLocaleString('tr-TR') + ' TL', styles: { fontStyle: 'bold' } }],
                [{ content: 'Toplam Gider', colSpan: 4, styles: { fontStyle: 'bold', fillColor: [240,240,240] } },
                 { content: totalExp.toLocaleString('tr-TR') + ' TL', styles: { fontStyle: 'bold' } }],
                [{ content: 'Net Kasa', colSpan: 4, styles: { fontStyle: 'bold', fillColor: [240,240,240] } },
                 { content: (totalInc - totalExp).toLocaleString('tr-TR') + ' TL', styles: { fontStyle: 'bold' } }]
            ]
        });
        doc.save(`kasa_${getMonthName(currentYear, currentMonth)}.pdf`);
        showToast('PDF raporu hazır');
    };

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    window.checkPin = () => {
        const pin = document.getElementById('pinInput').value;
        if(pin === "talha5534") {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            initTheme();
            loadData();
        } else { showToast('Hatalı şifre!', true); }
    };
    window.logout = () => {
        document.getElementById('loginContainer').style.display = 'flex';
        document.getElementById('appContainer').style.display = 'none';
        allTransactions = [];
    };
    document.getElementById('prevMonthBtn').onclick = () => changeMonth(-1);
    document.getElementById('nextMonthBtn').onclick = () => changeMonth(1);
    window.onload = () => { 
        document.getElementById('pinInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkPin(); });
        initTheme(); // giriş ekranında da tema uygulansın
    };
    document.getElementById('loginContainer').style.display = 'flex';
</script>
</body>
</html>
