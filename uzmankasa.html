<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="UzmanKasa">
    <title>UzmanKasa</title>
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- PDF KÜTÜPHANESİ DEĞİŞTİ: html2pdf.js (Türkçe karakter sorunu çözüldü) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* 🌙 KARANLIK TEMA DEĞİŞKENLERİ */
        :root {
            --bg-body: #f5f5f7;
            --bg-app: #ffffff;
            --border-light: #e9e9ef;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.04);
            --panel-bg: #f9f9fb;
            --btn-bg: #ffffff;
            --trans-cat-bg: #f2f2f5;
            --modal-bg: #ffffff;
            --input-bg: #f9f9fb;
            --icon-btn-border: #e9e9ef;
            --logout-color: #ff3b30;
        }
        
        body.dark {
            --bg-body: #000000;
            --bg-app: #1c1c1e;
            --border-light: #2c2c2e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --card-bg: #2c2c2e;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.3);
            --panel-bg: #2c2c2e;
            --btn-bg: #2c2c2e;
            --trans-cat-bg: #3a3a3c;
            --modal-bg: #2c2c2e;
            --input-bg: #1c1c1e;
            --icon-btn-border: #3a3a3c;
            --logout-color: #ff453a;
        }
        
        body {
            background: var(--bg-body);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        /* iOS stili kartlar */
        .app-container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-app);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.02);
            transition: background 0.2s ease;
        }
        /* Header */
        .app-header {
            padding: 20px 24px 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 0.5px solid var(--border-light);
        }
        .logo-area h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #000, #333);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        body.dark .logo-area h1 {
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo-area span { color: #ccff00; background: none; -webkit-background-clip: unset; background-clip: unset; }
        .header-actions { display: flex; gap: 12px; }
        .icon-btn {
            background: var(--btn-bg);
            border: 0.5px solid var(--icon-btn-border);
            color: #007aff;
            padding: 8px 16px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .logout-btn { color: var(--logout-color); }
        .theme-toggle-btn { color: var(--text-primary); background: var(--btn-bg); }

        /* Ay seçici */
        .month-panel {
            background: var(--panel-bg);
            margin: 16px 24px;
            padding: 8px 12px;
            border-radius: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .month-nav { display: flex; gap: 20px; align-items: center; }
        .month-nav-btn {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 36px;
            color: #007aff;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .current-month {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .month-select-dropdown {
            background: var(--btn-bg);
            border: 0.5px solid var(--border-light);
            border-radius: 30px;
            padding: 8px 16px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
        }

        /* KPI Kartları */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 0 24px 24px 24px;
        }
        .kpi-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            box-shadow: var(--card-shadow);
            border: 0.5px solid var(--border-light);
        }
        .kpi-title { font-size: 0.7rem; text-transform: uppercase; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.5px; margin-bottom: 8px; }
        .kpi-value { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; color: var(--text-primary); }
        .income-value { color: #34c759; }
        .expense-value { color: #ff3b30; }
        .balance-value { color: #007aff; }

        /* Grafik */
        .chart-section {
            background: var(--card-bg);
            margin: 0 24px 24px 24px;
            padding: 16px;
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            border: 0.5px solid var(--border-light);
        }
        .section-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
        canvas { max-height: 200px; width: 100% !important; }

        /* Butonlar */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin: 0 24px 24px 24px;
            flex-wrap: wrap;
        }
        .btn-income, .btn-expense {
            flex: 1;
            padding: 14px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-income { background: #e5f5e8; color: #2c6e3c; border: none; }
        .btn-expense { background: #ffe8e8; color: #c41e1e; border: none; }
        body.dark .btn-income { background: #1e3a2e; color: #4cd964; }
        body.dark .btn-expense { background: #3a1e1e; color: #ff5e5e; }

        /* İşlem Listesi */
        .transactions-header {
            display: flex;
            justify-content: space-between;
            margin: 0 24px 12px 24px;
        }
        .transaction-list {
            margin: 0 24px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .transaction-item {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: var(--card-shadow);
            border: 0.5px solid var(--border-light);
        }
        .transaction-item.income-trans { border-left: 4px solid #34c759; }
        .transaction-item.expense-trans { border-left: 4px solid #ff3b30; }
        .trans-detail { flex: 2; }
        .trans-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; color: var(--text-primary); }
        .trans-cat { font-size: 0.7rem; color: var(--text-secondary); background: var(--trans-cat-bg); display: inline-block; padding: 2px 10px; border-radius: 30px; }
        .trans-date { font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; }
        .trans-amount { font-weight: 700; font-size: 1rem; min-width: 100px; text-align: right; }
        .income-amount { color: #34c759; }
        .expense-amount { color: #ff3b30; }
        .delete-trans {
            background: transparent;
            border: none;
            color: #c6c6c8;
            font-size: 1rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 30px;
        }
        .delete-trans:hover { color: #ff3b30; background: rgba(255,59,48,0.1); }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-card {
            background: var(--modal-bg);
            border-radius: 36px;
            width: 90%;
            max-width: 400px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .modal-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; margin-bottom: 24px; color: var(--text-primary); }
        .modal-close { font-size: 1.5rem; cursor: pointer; color: var(--text-secondary); }
        .form-group { margin-bottom: 20px; }
        .form-group label { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; display: block; }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 0.5px solid var(--border-light);
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            color: var(--text-primary);
        }
        .modal-save {
            width: 100%;
            padding: 14px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 12px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1c1c1e;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            z-index: 3000;
            animation: slideIn 0.3s ease;
        }
        body.dark .toast {
            background: #2c2c2e;
            color: #fff;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 680px) {
            body { padding: 12px; }
            .app-header { padding: 16px; }
            .month-panel { margin: 12px 16px; }
            .kpi-grid { gap: 10px; margin: 0 16px 20px 16px; }
            .kpi-value { font-size: 1.4rem; }
            .action-buttons { margin: 0 16px 20px 16px; }
            .transactions-header { margin: 0 16px 10px 16px; }
            .transaction-list { margin: 0 16px 20px 16px; }
            .chart-section { margin: 0 16px 20px 16px; }
        }
        
        /* Login card tema uyumu */
        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-card {
            background: var(--card-bg);
            border-radius: 48px;
            padding: 40px 30px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            box-shadow: var(--card-shadow);
            border: 0.5px solid var(--border-light);
        }
        .login-logo { font-size: 2.5rem; font-weight: 700; letter-spacing: -1px; margin-bottom: 30px; color: var(--text-primary); }
        .login-logo span { color: #ccff00; }
        .login-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 0.5px solid var(--border-light);
            border-radius: 60px;
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #007aff;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="loginContainer" class="login-container" style="display:flex">
    <div class="login-card">
        <div class="login-logo">UZMAN<span>KASA</span></div>
        <input type="password" id="pinInput" class="login-input" placeholder="Şifre" autocomplete="off">
        <button class="login-btn" onclick="checkPin()">Giriş Yap</button>
    </div>
</div>

<div id="appContainer" class="app-container" style="display:none">
    <div class="app-header">
        <div class="logo-area"><h1>UZMAN<span>KASA</span></h1></div>
        <div class="header-actions">
            <button class="icon-btn theme-toggle-btn" id="themeToggleBtn"><i class="fas fa-moon"></i> Tema</button>
            <button class="icon-btn" onclick="exportToPDF()"><i class="fas fa-file-pdf"></i> PDF Rapor</button>
            <button class="icon-btn logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Çıkış</button>
        </div>
    </div>

    <div class="month-panel">
        <div class="month-nav">
            <button class="month-nav-btn" id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
            <div class="current-month" id="currentMonthDisplay">Haziran 2026</div>
            <button class="month-nav-btn" id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
        </div>
        <select id="monthSelect" class="month-select-dropdown"></select>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-title">Toplam Gelir</div><div class="kpi-value income-value" id="totalIncome">₺0</div></div>
        <div class="kpi-card"><div class="kpi-title">Toplam Gider</div><div class="kpi-value expense-value" id="totalExpense">₺0</div></div>
        <div class="kpi-card"><div class="kpi-title">Net Kasa</div><div class="kpi-value balance-value" id="netBalance">₺0</div></div>
    </div>

    <div class="chart-section">
        <div class="section-title"><i class="fas fa-chart-line" style="color:#007aff"></i> Aylık Gelir / Gider</div>
        <canvas id="monthlyChart" width="400" height="200"></canvas>
    </div>

    <div class="action-buttons">
        <button class="btn-income" onclick="openModal('incomeModal')"><i class="fas fa-plus-circle"></i> Gelir Ekle</button>
        <button class="btn-expense" onclick="openModal('expenseModal')"><i class="fas fa-minus-circle"></i> Gider Ekle</button>
    </div>

    <div class="transactions-header">
        <div class="section-title" style="margin:0">İşlem Geçmişi</div>
        <div id="transactionCount" style="color:var(--text-secondary)">0 işlem</div>
    </div>
    <div id="transactionList" class="transaction-list">Yükleniyor...</div>
</div>

<!-- Gelir Modal -->
<div id="incomeModal" class="modal">
    <div class="modal-card">
        <div class="modal-header"><span>Gelir Ekle</span><span class="modal-close" onclick="closeModal('incomeModal')">&times;</span></div>
        <div class="form-group"><label>İş / Müşteri Adı</label><input type="text" id="incomeTitle" class="form-control" placeholder="Örn: Medical Park Totem"></div>
        <div class="form-group"><label>Kategori</label><select id="incomeCat" class="form-control"><option>Tabela İmalatı</option><option>Cephe Giydirme</option><option>Dijital Baskı</option><option>Araç Giydirme</option><option>Fason Kesim</option></select></div>
        <div class="form-group"><label>Tutar (₺)</label><input type="number" id="incomeAmount" class="form-control" placeholder="0"></div>
        <button class="modal-save" onclick="addIncome()">Kaydet</button>
    </div>
</div>

<!-- Gider Modal -->
<div id="expenseModal" class="modal">
    <div class="modal-card">
        <div class="modal-header"><span>Gider Ekle</span><span class="modal-close" onclick="closeModal('expenseModal')">&times;</span></div>
        <div class="form-group"><label>Harcama Açıklaması</label><input type="text" id="expenseTitle" class="form-control" placeholder="Örn: Malzeme Alımı"></div>
        <div class="form-group"><label>Kategori</label><select id="expenseCat" class="form-control"><option>Malzeme Alımı</option><option>Personel Gideri</option><option>Araç Yakıt & Nakliye</option><option>Atölye (Kira/Elektrik)</option><option>Diğer</option></select></div>
        <div class="form-group"><label>Tutar (₺)</label><input type="number" id="expenseAmount" class="form-control" placeholder="0"></div>
        <button class="modal-save" onclick="addExpense()">Kaydet</button>
    </div>
</div>

<!-- Silme Onay Modal -->
<div id="confirmModal" class="modal">
    <div class="modal-card" style="max-width:360px">
        <div class="modal-header"><span>İşlemi Sil</span><span class="modal-close" onclick="closeModal('confirmModal')">&times;</span></div>
        <p style="margin-bottom:24px; color:var(--text-primary)">Bu işlem kalıcı olarak silinecek. Devam etmek istiyor musunuz?</p>
        <button class="modal-save" id="confirmDeleteBtn" style="background:#ff3b30">Evet, Sil</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAhBlHB0kZRB-IpEIGdHrS7ntzM17YpAWM",
        authDomain: "uzmankasa-94c54.firebaseapp.com",
        projectId: "uzmankasa-94c54",
        storageBucket: "uzmankasa-94c54.firebasestorage.app",
        messagingSenderId: "453163147831",
        appId: "1:453163147831:web:41311f3374b5d95d7115b2"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allTransactions = [];
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let chartInstance = null;
    let deleteId = null;

    // ----- TEMA YÖNETİMİ -----
    function initTheme() {
        // sistem temasını oku
        const darkModeMedia = window.matchMedia('(prefers-color-scheme: dark)');
        const savedTheme = localStorage.getItem('uzmanTheme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
            updateThemeIcon(true);
        } else if (savedTheme === 'light') {
            document.body.classList.remove('dark');
            updateThemeIcon(false);
        } else {
            // sistem tercihi
            if (darkModeMedia.matches) {
                document.body.classList.add('dark');
                updateThemeIcon(true);
            } else {
                document.body.classList.remove('dark');
                updateThemeIcon(false);
            }
        }
    }
    
    function updateThemeIcon(isDark) {
        const btn = document.getElementById('themeToggleBtn');
        if (btn) {
            if (isDark) {
                btn.innerHTML = '<i class="fas fa-sun"></i> Tema';
            } else {
                btn.innerHTML = '<i class="fas fa-moon"></i> Tema';
            }
        }
    }
    
    function toggleTheme() {
        if (document.body.classList.contains('dark')) {
            document.body.classList.remove('dark');
            localStorage.setItem('uzmanTheme', 'light');
            updateThemeIcon(false);
            showToast('Aydınlık tema aktif');
        } else {
            document.body.classList.add('dark');
            localStorage.setItem('uzmanTheme', 'dark');
            updateThemeIcon(true);
            showToast('Karanlık tema aktif');
        }
        // chart'ı yeniden render et (renkler otomatik değişir, ama chart instance yeniden çizilmezse sorun yok)
        if (chartInstance) {
            // chart'ın grid/text renkleri tema ile değişmiyor, ama sorun değil.
            chartInstance.update();
        }
    }
    
    // ----- PDF (html2pdf.js ile TÜRKÇE KARAKTER DESTEKLİ) -----
    window.exportToPDF = () => {
        const data = getFilteredTransactions();
        if (data.length === 0) { 
            showToast('Raporlanacak işlem yok', true); 
            return; 
        }
        
        let totalInc = 0, totalExp = 0;
        data.forEach(t => { 
            if(t.tip === 'gelir') totalInc += t.tutar; 
            else totalExp += t.tutar; 
        });
        
        // Geçici bir div oluştur, içine rapor HTML'ini koy (tasarım aynen, sadece PDF için)
        const tempDiv = document.createElement('div');
        tempDiv.style.padding = '20px';
        tempDiv.style.fontFamily = 'Inter, sans-serif';
        tempDiv.style.backgroundColor = '#ffffff';
        tempDiv.style.color = '#1c1c1e';
        // içerik
        tempDiv.innerHTML = `
            <h1 style="color:#000; margin-bottom:5px;">Uzman Reklam Kasa Raporu</h1>
            <p style="color:#666; margin-bottom:20px;">${getMonthName(currentYear, currentMonth)}</p>
            <table style="width:100%; border-collapse:collapse; margin-bottom:20px; background:#f9f9fb;">
                <tr style="background:#f2f2f5;">
                    <th style="padding:10px; text-align:left;">Toplam Gelir</th>
                    <td style="padding:10px; text-align:right; color:#34c759;">${formatMoney(totalInc)}</td>
                </tr>
                <tr style="background:#f2f2f5;">
                    <th style="padding:10px; text-align:left;">Toplam Gider</th>
                    <td style="padding:10px; text-align:right; color:#ff3b30;">${formatMoney(totalExp)}</td>
                </tr>
                <tr style="background:#f2f2f5;">
                    <th style="padding:10px; text-align:left;">Net Kasa</th>
                    <td style="padding:10px; text-align:right; color:#007aff;">${formatMoney(totalInc - totalExp)}</td>
                </tr>
            </table>
            <table style="width:100%; border-collapse:collapse; border:1px solid #ddd;">
                <thead>
                    <tr><th style="padding:8px; border:1px solid #ddd; background:#007aff; color:white;">Tarih (Gün & Saat)</th>
                        <th style="padding:8px; border:1px solid #ddd; background:#007aff; color:white;">Tip</th>
                        <th style="padding:8px; border:1px solid #ddd; background:#007aff; color:white;">Başlık</th>
                        <th style="padding:8px; border:1px solid #ddd; background:#007aff; color:white;">Kategori</th>
                        <th style="padding:8px; border:1px solid #ddd; background:#007aff; color:white;">Tutar</th>
                    </tr>
                </thead>
                <tbody>
                    ${data.map(t => {
                        let dateObj = new Date(t.tarih);
                        const gunler = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
                        const tarihStr = dateObj.toLocaleDateString('tr-TR') + ' ' + gunler[dateObj.getDay()] + ' ' + 
                                        dateObj.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
                        const bgColor = t.tip === 'gelir' ? '#e5f5e8' : '#ffe8e8';
                        return `
                            <tr style="background:${bgColor};">
                                <td style="padding:8px; border:1px solid #ddd;">${tarihStr}</td>
                                <td style="padding:8px; border:1px solid #ddd;">${t.tip === 'gelir' ? 'Gelir' : 'Gider'}</td>
                                <td style="padding:8px; border:1px solid #ddd;">${escapeHtml(t.baslik)}</td>
                                <td style="padding:8px; border:1px solid #ddd;">${escapeHtml(t.kategori)}</td>
                                <td style="padding:8px; border:1px solid #ddd; text-align:right;">${formatMoney(t.tutar)}</td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        `;
        document.body.appendChild(tempDiv);
        // html2pdf ayarları
        html2pdf().from(tempDiv).set({
            margin: [0.5, 0.5, 0.5, 0.5],
            filename: `kasa_${getMonthName(currentYear, currentMonth)}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, letterRendering: true },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
        }).save().then(() => {
            document.body.removeChild(tempDiv);
            showToast('PDF raporu hazır');
        }).catch(err => {
            document.body.removeChild(tempDiv);
            showToast('PDF oluşturulurken hata oluştu', true);
        });
    };
    
    // ----- FONKSİYONLAR (Aynen, sadece tema ve PDF değişti) -----
    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = isError ? '#ff3b30' : '#1c1c1e';
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    function formatMoney(amount) { return '₺' + amount.toLocaleString('tr-TR'); }
    
    async function loadData() {
        const q = query(collection(db, "islemler"), orderBy("tarih", "desc"));
        const snap = await getDocs(q);
        allTransactions = [];
        snap.forEach(docSnap => { let data = docSnap.data(); data.id = docSnap.id; allTransactions.push(data); });
        renderCurrentMonth();
        updateChart();
    }
    
    function getFilteredTransactions() {
        return allTransactions.filter(t => {
            let d = new Date(t.tarih);
            return d.getFullYear() === currentYear && d.getMonth() === currentMonth;
        });
    }
    
    function renderCurrentMonth() {
        const filtered = getFilteredTransactions();
        let totalInc = 0, totalExp = 0;
        let html = '';
        filtered.forEach(t => {
            if (t.tip === 'gelir') totalInc += t.tutar;
            else totalExp += t.tutar;
            let dateObj = new Date(t.tarih);
            let dateStr = dateObj.toLocaleDateString('tr-TR') + ' ' + dateObj.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
            const transClass = t.tip === 'gelir' ? 'income-trans' : 'expense-trans';
            const amountClass = t.tip === 'gelir' ? 'income-amount' : 'expense-amount';
            const sign = t.tip === 'gelir' ? '+' : '-';
            html += `
                <div class="transaction-item ${transClass}">
                    <div class="trans-detail">
                        <div class="trans-title">${escapeHtml(t.baslik)}</div>
                        <div><span class="trans-cat">${escapeHtml(t.kategori)}</span></div>
                        <div class="trans-date">${dateStr}</div>
                    </div>
                    <div class="trans-amount ${amountClass}">
                        ${sign} ${formatMoney(t.tutar)}
                    </div>
                    <button class="delete-trans" onclick="askDelete('${t.id}')"><i class="fas fa-trash-alt"></i></button>
                </div>
            `;
        });
        document.getElementById('totalIncome').innerHTML = formatMoney(totalInc);
        document.getElementById('totalExpense').innerHTML = formatMoney(totalExp);
        document.getElementById('netBalance').innerHTML = formatMoney(totalInc - totalExp);
        document.getElementById('transactionCount').innerHTML = filtered.length + ' işlem';
        document.getElementById('transactionList').innerHTML = html || '<div style="text-align:center;padding:40px;color:var(--text-secondary)">Bu ayda işlem yok</div>';
        document.getElementById('currentMonthDisplay').innerText = getMonthName(currentYear, currentMonth);
        populateMonthSelect();
    }
    
    function updateChart() {
        const months = [];
        const incomeData = [];
        const expenseData = [];
        const last6 = getLast6Months();
        for (let i = 0; i < last6.length; i++) {
            const { year, month } = last6[i];
            const filtered = allTransactions.filter(t => {
                let d = new Date(t.tarih);
                return d.getFullYear() === year && d.getMonth() === month;
            });
            let inc = 0, exp = 0;
            filtered.forEach(t => { if(t.tip === 'gelir') inc += t.tutar; else exp += t.tutar; });
            months.push(`${month+1}/${year.toString().slice(-2)}`);
            incomeData.push(inc);
            expenseData.push(exp);
        }
        const ctx = document.getElementById('monthlyChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: { labels: months, datasets: [
                { label: 'Gelir', data: incomeData, backgroundColor: '#34c759', borderRadius: 8 },
                { label: 'Gider', data: expenseData, backgroundColor: '#ff3b30', borderRadius: 8 }
            ]},
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: getComputedStyle(document.body).getPropertyValue('--text-primary') || '#1c1c1e', font: { weight: '500' } } } } }
        });
    }
    
    function getLast6Months() {
        let result = [];
        let year = currentYear, month = currentMonth;
        for (let i = 0; i < 6; i++) {
            result.unshift({ year, month });
            month--;
            if (month < 0) { month = 11; year--; }
        }
        return result;
    }
    
    function getMonthName(year, month) {
        const names = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
        return `${names[month]} ${year}`;
    }
    
    function populateMonthSelect() {
        const select = document.getElementById('monthSelect');
        const available = new Set();
        allTransactions.forEach(t => {
            let d = new Date(t.tarih);
            available.add(`${d.getFullYear()}-${d.getMonth()}`);
        });
        if (available.size === 0) available.add(`${currentYear}-${currentMonth}`);
        let options = Array.from(available).map(key => {
            let [y,m] = key.split('-');
            return { year: parseInt(y), month: parseInt(m), label: getMonthName(parseInt(y), parseInt(m)) };
        }).sort((a,b) => b.year - a.year || b.month - a.month);
        select.innerHTML = '';
        options.forEach(opt => {
            let option = document.createElement('option');
            option.value = `${opt.year}-${opt.month}`;
            option.textContent = opt.label;
            if (opt.year === currentYear && opt.month === currentMonth) option.selected = true;
            select.appendChild(option);
        });
        select.onchange = () => {
            let [y,m] = select.value.split('-');
            currentYear = parseInt(y); currentMonth = parseInt(m);
            renderCurrentMonth();
            updateChart();
        };
    }
    
    window.changeMonth = (delta) => {
        let newMonth = currentMonth + delta;
        let newYear = currentYear;
        if (newMonth < 0) { newMonth = 11; newYear--; }
        if (newMonth > 11) { newMonth = 0; newYear++; }
        currentYear = newYear; currentMonth = newMonth;
        renderCurrentMonth();
        updateChart();
    };
    
    window.addIncome = async () => {
        const baslik = document.getElementById('incomeTitle').value.trim();
        const kategori = document.getElementById('incomeCat').value;
        const tutar = parseFloat(document.getElementById('incomeAmount').value);
        if (!baslik || tutar <= 0) { showToast('Lütfen tüm alanları doldurun', true); return; }
        await addDoc(collection(db, "islemler"), { tip: "gelir", baslik, kategori, tutar, tarih: new Date().toISOString() });
        closeModal('incomeModal');
        document.getElementById('incomeTitle').value = '';
        document.getElementById('incomeAmount').value = '';
        await loadData();
        showToast('Gelir eklendi');
    };
    
    window.addExpense = async () => {
        const baslik = document.getElementById('expenseTitle').value.trim();
        const kategori = document.getElementById('expenseCat').value;
        const tutar = parseFloat(document.getElementById('expenseAmount').value);
        if (!baslik || tutar <= 0) { showToast('Lütfen tüm alanları doldurun', true); return; }
        await addDoc(collection(db, "islemler"), { tip: "gider", baslik, kategori, tutar, tarih: new Date().toISOString() });
        closeModal('expenseModal');
        document.getElementById('expenseTitle').value = '';
        document.getElementById('expenseAmount').value = '';
        await loadData();
        showToast('Gider eklendi');
    };
    
    window.askDelete = (id) => { deleteId = id; openModal('confirmModal'); };
    document.getElementById('confirmDeleteBtn').onclick = async () => {
        if (deleteId) { await deleteDoc(doc(db, "islemler", deleteId)); await loadData(); showToast('İşlem silindi'); deleteId = null; closeModal('confirmModal'); }
    };
    
    window.openModal = (id) => document.getElementById(id).style.display = 'flex';
    window.closeModal = (id) => document.getElementById(id).style.display = 'none';
    
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    
    window.checkPin = () => {
        const pin = document.getElementById('pinInput').value;
        if(pin === "talha5534") {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            loadData();
        } else { showToast('Hatalı şifre!', true); }
    };
    window.logout = () => {
        document.getElementById('loginContainer').style.display = 'flex';
        document.getElementById('appContainer').style.display = 'none';
        allTransactions = [];
    };
    document.getElementById('prevMonthBtn').onclick = () => changeMonth(-1);
    document.getElementById('nextMonthBtn').onclick = () => changeMonth(1);
    document.getElementById('themeToggleBtn').onclick = () => toggleTheme();
    
    window.onload = () => { 
        initTheme();
        document.getElementById('pinInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkPin(); }); 
    };
    
    document.getElementById('loginContainer').style.display = 'flex';
</script>
</body>
</html>
