<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MücahitKasa">
    <title>MücahitKasa | Şahsi Bütçe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #f5f5f7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #1c1c1e;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            transition: background 0.2s, color 0.2s;
        }
        body.light {
            background: #f5f5f7;
            color: #1c1c1e;
        }
        body.light .app-card,
        body.light .kpi-card,
        body.light .transaction-item,
        body.light .borc-card,
        body.light .chart-card,
        body.light .modal-card {
            background: #ffffff;
            border-color: #e9e9ef;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02), 0 4px 12px rgba(0,0,0,0.03);
        }
        body.dark {
            background: #000000;
            color: #ffffff;
        }
        body.dark .app-card,
        body.dark .kpi-card,
        body.dark .transaction-item,
        body.dark .borc-card,
        body.dark .chart-card,
        body.dark .modal-card {
            background: #1c1c1e;
            border-color: #2c2c2e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        body.dark .kpi-title,
        body.dark .borc-tarih,
        body.dark .section-title {
            color: #98989e;
        }
        body.dark .current-month {
            color: #ffffff;
        }
        body.dark .month-panel {
            background: #1c1c1e;
        }
        body.dark .form-control {
            background: #2c2c2e;
            border-color: #3a3a3c;
            color: white;
        }
        body.dark .icon-btn {
            background: #2c2c2e;
            border-color: #3a3a3c;
            color: #ffd966;
        }
        .trans-cat {
            background: #f2f2f5;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-block;
        }
        body.dark .trans-cat {
            background: #2c2c2e;
            color: #ffffff;
        }
        .app-container {
            width: 100%;
            max-width: 100%;
            margin: 0;
        }
        .app-card {
            border-radius: 28px;
            margin-bottom: 16px;
            padding: 16px;
        }
        .app-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .logo-area h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-align: center;
            margin: 0;
        }
        .logo-area .mucahit {
            color: #1c1c1e;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
        }
        .logo-area .kasa {
            color: #F5A623;
        }
        body.dark .logo-area .mucahit {
            color: #ffffff;
        }
        body.dark .logo-area .kasa {
            color: #FFD966;
        }
        .header-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .icon-btn {
            border: 0.5px solid;
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            background: #ffffff;
            transition: transform 0.1s, opacity 0.2s;
        }
        .icon-btn:active {
            transform: scale(0.97);
        }
        .month-panel {
            background: #f9f9fb;
            border-radius: 60px;
            padding: 6px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }
        .month-nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .month-nav-btn {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 36px;
            font-size: 1rem;
            cursor: pointer;
            color: #007aff;
            transition: transform 0.1s;
        }
        .month-nav-btn:active {
            transform: scale(0.9);
        }
        .current-month {
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .kpi-card {
            border-radius: 24px;
            padding: 14px;
            text-align: center;
            border: 0.5px solid;
            transition: transform 0.1s;
        }
        .kpi-card:active {
            transform: scale(0.98);
        }
        .kpi-title {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .kpi-value {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .income-value { color: #34c759; }
        .expense-value { color: #ff3b30; }
        .balance-value { color: #0A2540; }
        body.dark .balance-value { color: #ffffff; }

        .chart-row {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }
        .chart-card {
            border-radius: 28px;
            padding: 12px;
            border: 0.5px solid;
        }
        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .segment-control {
            display: flex;
            gap: 6px;
            background: rgba(120,120,128,0.16);
            padding: 4px;
            border-radius: 40px;
        }
        .segment-btn {
            background: transparent;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #007aff;
        }
        .segment-btn.active {
            background: #007aff;
            color: white;
        }
        body.dark .segment-btn.active {
            background: #0A84FF;
        }
        canvas {
            max-height: 180px;
            width: 100% !important;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-income, .btn-expense, .btn-borc, .btn-alacak {
            flex: 1;
            padding: 12px 0;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            border: none;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-income:active, .btn-expense:active, .btn-borc:active, .btn-alacak:active {
            transform: scale(0.97);
        }
        .btn-income { background: #e5f5e8; color: #2c6e3c; }
        .btn-expense { background: #ffe8e8; color: #c41e1e; }
        .btn-borc { background: #fff0e0; color: #cc7b00; }
        .btn-alacak { background: #e0f0ff; color: #0066cc; }
        .borc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .borc-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .borc-card {
            border-radius: 20px;
            padding: 12px;
            border: 0.5px solid;
            border-left: 4px solid #ff9f1c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .borc-card.alacak {
            border-left-color: #34c759;
        }
        .borc-detay {
            flex: 2;
        }
        .borc-title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .borc-tarih {
            font-size: 0.7rem;
            color: #8e8e93;
        }
        .warning-overdue {
            color: #ff3b30;
            font-weight: 600;
        }
        .warning-coming {
            color: #ff9500;
            font-weight: 600;
        }
        .borc-tutar {
            font-weight: 700;
            font-size: 1rem;
        }
        .btn-ode {
            background: #ff9f1c;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            min-width: 95px;
            white-space: nowrap;
            transition: transform 0.1s;
        }
        .btn-ode:active {
            transform: scale(0.95);
        }
        .borc-card.alacak .btn-ode {
            background: #34c759;
        }
        .transaction-item {
            border-radius: 20px;
            margin-bottom: 8px;
            border: 0.5px solid;
            position: relative;
            overflow: hidden;
        }
        .transaction-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: inherit;
            width: 100%;
            transition: transform 0.2s;
        }
        .swipe-delete {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 70px;
            background: #ff3b30;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            transform: translateX(100%);
            transition: transform 0.2s;
            border-radius: 20px;
            cursor: pointer;
        }
        .transaction-item.swiped .swipe-delete {
            transform: translateX(0);
        }
        .transaction-item.swiped .transaction-content {
            transform: translateX(-70px);
        }
        .search-box input {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: 0.5px solid #e9e9ef;
            background: #f9f9fb;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .transactions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-buttons {
            display: flex;
            gap: 8px;
        }
        .filter-btn {
            background: transparent;
            border: 0.5px solid #e9e9ef;
            border-radius: 30px;
            padding: 6px 12px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .filter-btn:active {
            transform: scale(0.95);
        }
        body.dark .filter-btn {
            border-color: #3a3a3c;
            color: #fff;
        }
        .filter-btn.active {
            background: #007aff;
            color: white;
            border-color: #007aff;
        }
        .load-more-btn {
            background: transparent;
            border: 0.5px solid #e9e9ef;
            border-radius: 40px;
            padding: 10px;
            width: 100%;
            text-align: center;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
            color: #007aff;
            transition: transform 0.1s;
        }
        .load-more-btn:active {
            transform: scale(0.98);
        }
        body.dark .load-more-btn {
            border-color: #3a3a3c;
            color: #ffd966;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-card {
            border-radius: 36px;
            width: 90%;
            max-width: 380px;
            padding: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 16px;
        }
        .modal-close {
            cursor: pointer;
            font-size: 1.5rem;
            line-height: 1;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #6c6c70;
            display: block;
            margin-bottom: 4px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background: #f9f9fb;
            border: 0.5px solid #e9e9ef;
            border-radius: 30px;
            font-size: 0.9rem;
        }
        .modal-save {
            width: 100%;
            padding: 12px;
            background: #0A2540;
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .modal-save:active {
            transform: scale(0.97);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #1c1c1e;
            color: white;
            padding: 12px;
            border-radius: 40px;
            text-align: center;
            z-index: 3000;
            animation: fadeUp 0.3s;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .remember-row label {
            font-size: 0.8rem;
            color: #6c6c70;
        }
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 4000;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }
        .spinner-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .spinner-content {
            background: rgba(28,28,30,0.9);
            border-radius: 60px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-weight: 500;
            backdrop-filter: blur(12px);
        }
        .fa-spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="light">
<div id="loginContainer" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; display:flex; justify-content:center; align-items:center; z-index:1000;">
    <div style="background:#fff; border-radius:48px; padding:40px 30px; width:90%; max-width:340px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.05); border:0.5px solid #e9e9ef;">
        <div class="logo-area" style="margin-bottom:30px;"><h1><span class="mucahit">MÜCAHİT</span><span class="kasa">KASA</span></h1></div>
        <input type="password" id="pinInput" style="width:100%; padding:14px; background:#f9f9fb; border:0.5px solid #e9e9ef; border-radius:60px; text-align:center; margin-bottom:16px;" placeholder="Şifre" autocomplete="off">
        <div class="remember-row">
            <input type="checkbox" id="rememberCheckbox">
            <label>Beni hatırla</label>
        </div>
        <button id="loginBtn" style="width:100%; padding:14px; background:#0A2540; color:white; font-weight:600; border:none; border-radius:60px;">Giriş Yap</button>
    </div>
</div>
<div class="spinner-overlay" id="globalSpinner"><div class="spinner-content"><i class="fas fa-spinner fa-spin"></i> Yükleniyor...</div></div>

<div id="appContainer" class="app-container" style="display:none">
    <div class="app-card">
        <div class="app-header">
            <div class="logo-area"><h1><span class="mucahit">MÜCAHİT</span><span class="kasa">KASA</span></h1></div>
            <div class="header-actions">
                <button class="icon-btn" id="themeToggleBtn"><i class="fas fa-moon"></i></button>
                <button class="icon-btn" id="pdfBtn"><i class="fas fa-file-pdf"></i> PDF</button>
                <button class="icon-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
        <div class="month-panel">
            <div class="month-nav">
                <button class="month-nav-btn" id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
                <div class="current-month" id="currentMonthDisplay">Haziran 2026</div>
                <button class="month-nav-btn" id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
        <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-title">Bu Ay Gelir</div><div class="kpi-value income-value" id="monthIncome">₺0</div></div>
            <div class="kpi-card"><div class="kpi-title">Bu Ay Gider</div><div class="kpi-value expense-value" id="monthExpense">₺0</div></div>
            <div class="kpi-card"><div class="kpi-title">Kalan Bütçe</div><div class="kpi-value balance-value" id="monthRemaining">₺0</div></div>
        </div>
    </div>

    <div class="chart-row">
        <div class="chart-card">
            <div class="section-title">
                <span><i class="fas fa-chart-line"></i> Gelir/Gider</span>
                <div class="segment-control" id="linePeriodControl">
                    <button class="segment-btn" data-line-period="day">Gün</button>
                    <button class="segment-btn" data-line-period="week">Hafta</button>
                    <button class="segment-btn active" data-line-period="month">Ay</button>
                </div>
            </div>
            <canvas id="monthlyChart"></canvas>
        </div>
        <div class="chart-card">
            <div class="section-title">
                <span><i class="fas fa-chart-pie"></i> Gider Dağılımı</span>
                <div class="segment-control" id="piePeriodControl">
                    <button class="segment-btn" data-pie-period="day">Gün</button>
                    <button class="segment-btn" data-pie-period="week">Hafta</button>
                    <button class="segment-btn active" data-pie-period="month">Ay</button>
                </div>
            </div>
            <canvas id="categoryChart"></canvas>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn-income" id="openIncomeModal"><i class="fas fa-plus-circle"></i> Gelir</button>
        <button class="btn-expense" id="openExpenseModal"><i class="fas fa-minus-circle"></i> Gider</button>
        <button class="btn-borc" id="openBorcModal"><i class="fas fa-hand-holding-usd"></i> Borç</button>
        <button class="btn-alacak" id="openAlacakModal"><i class="fas fa-money-bill-wave"></i> Alacak</button>
    </div>

    <div class="borc-header">
        <div class="section-title"><i class="fas fa-exchange-alt"></i> Borç & Alacaklar</div>
        <div id="borcOzet" style="font-size:0.7rem;"></div>
    </div>
    <div id="borcList" class="borc-list">Yükleniyor...</div>

    <div class="search-box"><input type="text" id="searchInput" placeholder="İşlem ara (başlık/kategori)"></div>
    
    <div class="transactions-header">
        <div class="section-title"><i class="fas fa-history"></i> İşlem Geçmişi <span id="transactionCount" style="font-size:0.7rem; margin-left:8px;"></span></div>
        <div class="filter-buttons" id="filterButtons">
            <button class="filter-btn active" data-filter="all">Tümü</button>
            <button class="filter-btn" data-filter="gelir">💰 Gelir</button>
            <button class="filter-btn" data-filter="gider">💸 Gider</button>
        </div>
    </div>
    <div id="transactionList" class="transaction-list"></div>
    <div id="loadMoreContainer" style="margin-top: 8px;"></div>
</div>

<!-- Modals -->
<div id="incomeModal" class="modal"><div class="modal-card"><div class="modal-header"><span>Gelir Ekle</span><span class="modal-close" data-modal="incomeModal">&times;</span></div>
    <div class="form-group"><label>Başlık</label><input type="text" id="incomeTitle" class="form-control" placeholder="Tag işi, maaş"></div>
    <div class="form-group"><label>Kategori</label><select id="incomeCat" class="form-control"><option>Tag İşleri</option><option>Maaş</option><option>Serbest İş</option><option>Hediye</option><option>Yatırım</option><option>Diğer</option></select></div>
    <div class="form-group"><label>Tutar (₺)</label><input type="number" id="incomeAmount" class="form-control"></div>
    <button class="modal-save" id="saveIncomeBtn">Kaydet</button>
</div></div>

<div id="expenseModal" class="modal"><div class="modal-card"><div class="modal-header"><span>Gider Ekle</span><span class="modal-close" data-modal="expenseModal">&times;</span></div>
    <div class="form-group"><label>Başlık</label><input type="text" id="expenseTitle" class="form-control" placeholder="Kahve, fatura"></div>
    <div class="form-group"><label>Kategori</label><select id="expenseCat" class="form-control"><option>Faturalar</option><option>Tag Malzemesi</option><option>Alışveriş</option><option>Yeme/İçme</option><option>Ulaşım</option><option>Sağlık</option><option>Eğlence</option><option>Kira/Aidat</option><option>Borç Ödemesi</option><option>Diğer</option></select></div>
    <div class="form-group"><label>Tutar (₺)</label><input type="number" id="expenseAmount" class="form-control"></div>
    <button class="modal-save" id="saveExpenseBtn">Kaydet</button>
</div></div>

<div id="borcModal" class="modal"><div class="modal-card"><div class="modal-header"><span>Borç Ekle</span><span class="modal-close" data-modal="borcModal">&times;</span></div>
    <div class="form-group"><label>Kişi/Kurum</label><input type="text" id="borcKisi" class="form-control"></div>
    <div class="form-group"><label>Miktar (₺)</label><input type="number" id="borcMiktar" class="form-control"></div>
    <div class="form-group"><label>Son Ödeme Tarihi</label><input type="date" id="borcTarih" class="form-control"></div>
    <div class="form-group"><label>Açıklama</label><input type="text" id="borcAciklama" class="form-control"></div>
    <button class="modal-save" id="saveBorcBtn">Ekle</button>
</div></div>

<div id="alacakModal" class="modal"><div class="modal-card"><div class="modal-header"><span>Alacak Ekle</span><span class="modal-close" data-modal="alacakModal">&times;</span></div>
    <div class="form-group"><label>Kişi/Kurum</label><input type="text" id="alacakKisi" class="form-control"></div>
    <div class="form-group"><label>Miktar (₺)</label><input type="number" id="alacakMiktar" class="form-control"></div>
    <div class="form-group"><label>Tahmini Tarih</label><input type="date" id="alacakTarih" class="form-control"></div>
    <div class="form-group"><label>Açıklama</label><input type="text" id="alacakAciklama" class="form-control"></div>
    <button class="modal-save" id="saveAlacakBtn">Ekle</button>
</div></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAhBlHB0kZRB-IpEIGdHrS7ntzM17YpAWM",
        authDomain: "uzmankasa-94c54.firebaseapp.com",
        projectId: "uzmankasa-94c54",
        storageBucket: "uzmankasa-94c54.firebasestorage.app",
        messagingSenderId: "453163147831",
        appId: "1:453163147831:web:41311f3374b5d95d7115b2"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allGelirler = [], allGiderler = [], allBorclar = [], allAlacaklar = [];
    let currentYear = new Date().getFullYear(), currentMonth = new Date().getMonth();
    let chart1 = null, chart2 = null;
    let isProcessing = false;
    let currentFilter = "all";
    let currentDisplayCount = 10;
    let allTransactionsArray = [];
    let filteredTransactionsArray = [];
    let currentPiePeriod = "month";
    let currentLinePeriod = "month";

    // Yerel tarih parse (YYYY-MM-DD)
    function parseLocalDate(dateStr) {
        if (!dateStr) return null;
        let parts = dateStr.split('T')[0].split('-');
        if (parts.length === 3) {
            return new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
        }
        return new Date(dateStr);
    }

    function formatDateOnly(dateInput) {
        let d = parseLocalDate(dateInput);
        if (!d || isNaN(d)) d = new Date(dateInput);
        if (isNaN(d.getTime())) return "Geçersiz Tarih";
        const gunler = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
        const gunAdi = gunler[d.getDay()];
        return `${d.toLocaleDateString('tr-TR')} ${gunAdi}`;
    }

    function getDaysUntilDue(dateStr) {
        const target = parseLocalDate(dateStr);
        if (!target) return null;
        const today = new Date();
        today.setHours(0,0,0,0);
        const diffTime = target - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays;
    }

    function getWarningText(dateStr) {
        const days = getDaysUntilDue(dateStr);
        if (days === null) return "";
        if (days < 0) return '<span class="warning-overdue">⚠️ Gecikti</span>';
        if (days <= 7) return '<span class="warning-coming">🕒 Yaklaşıyor (' + days + ' gün)</span>';
        return "";
    }

    function showLoading(show) {
        const spinner = document.getElementById('globalSpinner');
        if(show) spinner.classList.add('active');
        else spinner.classList.remove('active');
    }

    function showToast(msg, err = false) {
        let t = document.createElement('div'); t.className = 'toast'; t.innerText = msg; t.style.background = err ? '#ff3b30' : '#1c1c1e'; document.body.appendChild(t); setTimeout(() => t.remove(), 2500);
    }
    function formatMoney(amt) { return '₺' + amt.toLocaleString('tr-TR'); }

    async function loadAll() {
        showLoading(true);
        try {
            const g1 = await getDocs(query(collection(db, "mucahit_gelirler"), orderBy("tarih", "desc")));
            allGelirler = g1.docs.map(d => ({ id: d.id, ...d.data() }));
            const g2 = await getDocs(query(collection(db, "mucahit_giderler"), orderBy("tarih", "desc")));
            allGiderler = g2.docs.map(d => ({ id: d.id, ...d.data() }));
            const b1 = await getDocs(collection(db, "mucahit_borclar"));
            allBorclar = b1.docs.map(d => ({ id: d.id, ...d.data(), tip: 'borc' }));
            const b2 = await getDocs(collection(db, "mucahit_alacaklar"));
            allAlacaklar = b2.docs.map(d => ({ id: d.id, ...d.data(), tip: 'alacak' }));
            
            allTransactionsArray = [...allGelirler.map(g => ({ ...g, tip: 'gelir', tutar: g.tutar, baslik: g.baslik, kategori: g.kategori, tarih: g.tarih, docId: g.id })),
                                   ...allGiderler.map(g => ({ ...g, tip: 'gider', tutar: g.tutar, baslik: g.baslik, kategori: g.kategori, tarih: g.tarih, docId: g.id }))];
            allTransactionsArray.sort((a,b) => new Date(b.tarih) - new Date(a.tarih));
            renderDashboard();
        } catch(error) {
            showToast("Veri yüklenemedi: " + error.message, true);
        } finally {
            showLoading(false);
        }
    }

    function getCurrentFilterObj() { return { year: currentYear, month: currentMonth }; }

    function renderDashboard() {
        const { year, month } = getCurrentFilterObj();
        let aylikGelir = 0, aylikGider = 0;
        allGelirler.forEach(g => { let d = parseLocalDate(g.tarih); if(d && d.getFullYear()===year && d.getMonth()===month) aylikGelir += g.tutar; });
        allGiderler.forEach(g => { let d = parseLocalDate(g.tarih); if(d && d.getFullYear()===year && d.getMonth()===month) aylikGider += g.tutar; });
        document.getElementById('monthIncome').innerHTML = formatMoney(aylikGelir);
        document.getElementById('monthExpense').innerHTML = formatMoney(aylikGider);
        document.getElementById('monthRemaining').innerHTML = formatMoney(aylikGelir - aylikGider);
        document.getElementById('currentMonthDisplay').innerText = getMonthName(year, month);
        renderBorcList();
        applyFilterAndRender();
        updateCharts();
    }

    function renderBorcList() {
        let html = '';
        let geciken = 0;
        [...allBorclar, ...allAlacaklar].forEach(item => {
            const isBorc = item.tip === 'borc';
            const warningHtml = getWarningText(item.tarih);
            if(warningHtml.includes('Gecikti') && isBorc) geciken++;
            html += `<div class="borc-card ${isBorc ? '' : 'alacak'}">
                <div class="borc-detay">
                    <div class="borc-title">${isBorc ? '🧾 Borç' : '💰 Alacak'} - ${escapeHtml(item.kisi)}</div>
                    <div class="borc-tarih">Son Tarih: ${formatDateOnly(item.tarih)} ${warningHtml}</div>
                    <div style="font-size:0.7rem; color:#8e8e93;">${escapeHtml(item.aciklama || '')}</div>
                </div>
                <div class="borc-tutar" style="color:${isBorc ? '#ff3b30' : '#34c759'}">${formatMoney(item.miktar)}</div>
                <button class="btn-ode" data-id="${item.id}" data-tip="${item.tip}" data-miktar="${item.miktar}">${isBorc ? 'Ödendi' : 'Tahsil Edildi'}</button>
            </div>`;
        });
        if(html === '') html = '<div style="text-align:center;padding:20px;">Borç/Alacak yok</div>';
        document.getElementById('borcList').innerHTML = html;
        document.getElementById('borcOzet').innerHTML = `⚠️ ${geciken} gecikmiş borç`;
        document.querySelectorAll('.borc-card .btn-ode').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                if(isProcessing) return;
                isProcessing = true;
                showLoading(true);
                const id = btn.dataset.id;
                const tip = btn.dataset.tip;
                const miktar = parseFloat(btn.dataset.miktar);
                try {
                    if(tip === 'borc') {
                        await addDoc(collection(db, "mucahit_giderler"), { baslik: "Borç Ödemesi", kategori: "Borç Ödemesi", tutar: miktar, tarih: new Date().toISOString() });
                        await deleteDoc(doc(db, "mucahit_borclar", id));
                        showToast("Borç ödendi, gidere eklendi");
                    } else {
                        await addDoc(collection(db, "mucahit_gelirler"), { baslik: "Alacak Tahsilatı", kategori: "Diğer", tutar: miktar, tarih: new Date().toISOString() });
                        await deleteDoc(doc(db, "mucahit_alacaklar", id));
                        showToast("Alacak tahsil edildi, gelire eklendi");
                    }
                    await loadAll();
                } catch(err) {
                    showToast("İşlem başarısız: " + err.message, true);
                } finally {
                    isProcessing = false;
                    showLoading(false);
                }
            });
        });
    }

    function applyFilterAndRender() {
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
        filteredTransactionsArray = allTransactionsArray.filter(t => {
            const matchesSearch = t.baslik.toLowerCase().includes(searchTerm) || t.kategori.toLowerCase().includes(searchTerm);
            if(currentFilter === 'gelir') return matchesSearch && t.tip === 'gelir';
            if(currentFilter === 'gider') return matchesSearch && t.tip === 'gider';
            return matchesSearch;
        });
        currentDisplayCount = 10;
        renderTransactionListWithPagination();
    }

    function renderTransactionListWithPagination() {
        const container = document.getElementById('transactionList');
        const loadMoreContainer = document.getElementById('loadMoreContainer');
        const toShow = filteredTransactionsArray.slice(0, currentDisplayCount);
        container.innerHTML = '';
        
        toShow.forEach(t => {
            let dateStr = formatDateOnly(t.tarih);
            let icon = t.tip === 'gelir' ? '💰' : '💸';
            let itemDiv = document.createElement('div');
            itemDiv.className = 'transaction-item';
            itemDiv.dataset.id = t.docId;
            itemDiv.dataset.tip = t.tip;
            itemDiv.innerHTML = `
                <div class="transaction-content">
                    <div>
                        <div style="font-weight:600;">${icon} ${escapeHtml(t.baslik)}</div>
                        <div><span class="trans-cat">${escapeHtml(t.kategori)}</span></div>
                        <div style="font-size:0.7rem; color:#8e8e93;">${dateStr}</div>
                    </div>
                    <div style="font-weight:700; color:${t.tip === 'gelir' ? '#34c759' : '#ff3b30'}">${t.tip === 'gelir' ? '+' : '-'} ${formatMoney(t.tutar)}</div>
                </div>
                <div class="swipe-delete"><i class="fas fa-trash-alt"></i> Sil</div>
            `;
            let startX = 0;
            let isSwiping = false;
            const handleStart = (clientX) => { startX = clientX; isSwiping = true; };
            const handleMove = (clientX) => {
                if(!isSwiping) return;
                let diff = startX - clientX;
                if(diff > 25 && diff < 100) itemDiv.classList.add('swiped');
                else if(diff < -25) itemDiv.classList.remove('swiped');
            };
            const handleEnd = () => { isSwiping = false; };
            itemDiv.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientX));
            itemDiv.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX));
            itemDiv.addEventListener('touchend', handleEnd);
            itemDiv.addEventListener('mousedown', (e) => handleStart(e.clientX));
            itemDiv.addEventListener('mousemove', (e) => handleMove(e.clientX));
            itemDiv.addEventListener('mouseup', handleEnd);
            
            const deleteBtn = itemDiv.querySelector('.swipe-delete');
            deleteBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if(isProcessing) return;
                isProcessing = true;
                showLoading(true);
                const id = itemDiv.dataset.id;
                const tip = itemDiv.dataset.tip;
                try {
                    if(tip === 'gelir') await deleteDoc(doc(db, "mucahit_gelirler", id));
                    else await deleteDoc(doc(db, "mucahit_giderler", id));
                    showToast("İşlem silindi");
                    await loadAll();
                } catch(err) {
                    showToast("Silme hatası, yeniden dene", true);
                } finally {
                    isProcessing = false;
                    showLoading(false);
                }
            });
            container.appendChild(itemDiv);
        });
        
        document.getElementById('transactionCount').innerHTML = `${filteredTransactionsArray.length} işlem`;
        loadMoreContainer.innerHTML = '';
        if(currentDisplayCount < filteredTransactionsArray.length) {
            let btn = document.createElement('button');
            btn.innerText = 'Daha Fazla Yükle';
            btn.className = 'load-more-btn';
            btn.onclick = () => {
                currentDisplayCount += 10;
                renderTransactionListWithPagination();
            };
            loadMoreContainer.appendChild(btn);
        }
    }

    function updateCharts() {
        updateLineChart();
        updatePieChart();
    }

    function updateLineChart() {
        let labels = [];
        let gelirData = [];
        let giderData = [];
        const now = new Date();
        now.setHours(0,0,0,0);
        
        if (currentLinePeriod === 'day') {
            // Son 7 gün
            for (let i = 6; i >= 0; i--) {
                let d = new Date(now);
                d.setDate(now.getDate() - i);
                let gelirTop = 0, giderTop = 0;
                allGelirler.forEach(g => {
                    let d2 = parseLocalDate(g.tarih);
                    if(d2 && d2.toDateString() === d.toDateString()) gelirTop += g.tutar;
                });
                allGiderler.forEach(g => {
                    let d2 = parseLocalDate(g.tarih);
                    if(d2 && d2.toDateString() === d.toDateString()) giderTop += g.tutar;
                });
                gelirData.push(gelirTop);
                giderData.push(giderTop);
                labels.push(d.toLocaleDateString('tr-TR', {day:'numeric', month:'short'}));
            }
        } else if (currentLinePeriod === 'week') {
            // Son 6 hafta (Pazartesi başlangıçlı)
            for (let w = 5; w >= 0; w--) {
                let startOfWeek = new Date(now);
                startOfWeek.setDate(now.getDate() - (now.getDay() === 0 ? 6 : now.getDay() - 1) - (w * 7));
                startOfWeek.setHours(0,0,0,0);
                let endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);
                endOfWeek.setHours(23,59,59,999);
                let gelirTop = 0, giderTop = 0;
                allGelirler.forEach(g => {
                    let d = parseLocalDate(g.tarih);
                    if(d && d >= startOfWeek && d <= endOfWeek) gelirTop += g.tutar;
                });
                allGiderler.forEach(g => {
                    let d = parseLocalDate(g.tarih);
                    if(d && d >= startOfWeek && d <= endOfWeek) giderTop += g.tutar;
                });
                gelirData.push(gelirTop);
                giderData.push(giderTop);
                labels.push(`${startOfWeek.getDate()}/${startOfWeek.getMonth()+1} - ${endOfWeek.getDate()}/${endOfWeek.getMonth()+1}`);
            }
        } else { // month
            for (let i=5; i>=0; i--) {
                let d = new Date(currentYear, currentMonth - i, 1);
                let gelirTop = 0, giderTop = 0;
                allGelirler.forEach(g => {
                    let d2 = parseLocalDate(g.tarih);
                    if(d2 && d2.getFullYear()===d.getFullYear() && d2.getMonth()===d.getMonth()) gelirTop += g.tutar;
                });
                allGiderler.forEach(g => {
                    let d2 = parseLocalDate(g.tarih);
                    if(d2 && d2.getFullYear()===d.getFullYear() && d2.getMonth()===d.getMonth()) giderTop += g.tutar;
                });
                gelirData.push(gelirTop);
                giderData.push(giderTop);
                labels.push(`${d.getMonth()+1}/${d.getFullYear().toString().slice(-2)}`);
            }
        }
        
        const isDark = document.body.classList.contains('dark');
        const fontColor = isDark ? '#ffffff' : '#1c1c1e';
        const ctx1 = document.getElementById('monthlyChart').getContext('2d');
        if(chart1) chart1.destroy();
        chart1 = new Chart(ctx1, {
            type: 'line',
            data: { labels, datasets: [{ label: 'Gelir', data: gelirData, borderColor: '#34c759', backgroundColor: 'transparent', tension: 0.3, fill: false, pointBackgroundColor: '#34c759' }, { label: 'Gider', data: giderData, borderColor: '#ff3b30', backgroundColor: 'transparent', tension: 0.3, fill: false, pointBackgroundColor: '#ff3b30' }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: fontColor } } } }
        });
    }

    function updatePieChart() {
        let period = currentPiePeriod;
        let now = new Date();
        now.setHours(0,0,0,0);
        let startDate, endDate;
        if (period === 'day') {
            startDate = now;
            endDate = new Date(now);
            endDate.setHours(23,59,59,999);
        } else if (period === 'week') {
            let dayOfWeek = now.getDay();
            let diffToMonday = (dayOfWeek === 0 ? 6 : dayOfWeek - 1);
            startDate = new Date(now);
            startDate.setDate(now.getDate() - diffToMonday);
            startDate.setHours(0,0,0,0);
            endDate = new Date(startDate);
            endDate.setDate(startDate.getDate() + 6);
            endDate.setHours(23,59,59,999);
        } else { // month
            startDate = new Date(currentYear, currentMonth, 1);
            endDate = new Date(currentYear, currentMonth + 1, 0);
            endDate.setHours(23,59,59,999);
        }
        
        let catMap = new Map();
        allGiderler.forEach(g => {
            let d = parseLocalDate(g.tarih);
            if (d && d >= startDate && d <= endDate) {
                catMap.set(g.kategori, (catMap.get(g.kategori)||0) + g.tutar);
            }
        });
        
        const isDark = document.body.classList.contains('dark');
        const fontColor = isDark ? '#ffffff' : '#1c1c1e';
        const kurumsalRenkler = ['#2C3E50', '#E67E22', '#2ECC71', '#E74C3C', '#3498DB', '#9B59B6', '#1ABC9C', '#F1C40F', '#E67E22', '#7F8C8D'];
        const ctx2 = document.getElementById('categoryChart').getContext('2d');
        if(chart2) chart2.destroy();
        chart2 = new Chart(ctx2, {
            type: 'pie',
            data: { labels: Array.from(catMap.keys()), datasets: [{ data: Array.from(catMap.values()), backgroundColor: kurumsalRenkler.slice(0, catMap.size) }] },
            options: { plugins: { legend: { labels: { color: fontColor } } } }
        });
    }

    window.exportToPDF = async () => {
        showLoading(true);
        const { year, month } = getCurrentFilterObj();
        let aylikGelir=0, aylikGider=0;
        let aylikIslemler = [];
        allGelirler.forEach(g => { let d = parseLocalDate(g.tarih); if(d && d.getFullYear()===year && d.getMonth()===month) { aylikGelir += g.tutar; aylikIslemler.push({...g, tip:'Gelir'}); } });
        allGiderler.forEach(g => { let d = parseLocalDate(g.tarih); if(d && d.getFullYear()===year && d.getMonth()===month) { aylikGider += g.tutar; aylikIslemler.push({...g, tip:'Gider'}); } });
        aylikIslemler.sort((a,b)=>new Date(b.tarih)-new Date(a.tarih));
        
        const pdfDiv = document.createElement('div');
        pdfDiv.style.padding = '16px';
        pdfDiv.style.fontFamily = 'Inter, sans-serif';
        pdfDiv.style.backgroundColor = '#fff';
        pdfDiv.style.color = '#000';
        pdfDiv.innerHTML = `
            <h1 style="font-size:24px; font-weight:800; text-align:center;">MÜCAHİTKASA RAPORU</h1>
            <p style="text-align:center; color:#666;">${getMonthName(year, month)}</p>
            <div style="display:flex; gap:12px; margin:16px 0;">
                <div style="flex:1; background:#f5f5f7; padding:12px; border-radius:20px;"><div>Gelir</div><div style="font-size:20px; color:#34c759;">${formatMoney(aylikGelir)}</div></div>
                <div style="flex:1; background:#f5f5f7; padding:12px; border-radius:20px;"><div>Gider</div><div style="font-size:20px; color:#ff3b30;">${formatMoney(aylikGider)}</div></div>
                <div style="flex:1; background:#f5f5f7; padding:12px; border-radius:20px;"><div>Kalan</div><div style="font-size:20px;">${formatMoney(aylikGelir-aylikGider)}</div></div>
            </div>
            <table style="width:100%; border-collapse:collapse; font-size:11px;">
                <thead><tr style="background:#f2f2f2;"><th style="padding:8px;">Tarih</th><th>Tip</th><th>Başlık</th><th>Kategori</th><th>Tutar</th></tr></thead>
                <tbody>${aylikIslemler.map(t => {
                    const rowBg = t.tip === 'Gelir' ? '#f0fff0' : '#fff0f0';
                    return `<tr style="background:${rowBg};">
                        <td style="padding:6px;">${formatDateOnly(t.tarih)}</td>
                        <td>${t.tip}</td>
                        <td>${escapeHtml(t.baslik)}</td>
                        <td>${escapeHtml(t.kategori)}</td>
                        <td style="text-align:right;">${formatMoney(t.tutar)}</td>
                    </tr>`;
                }).join('')}</tbody>
            </table>
            <div style="margin-top:16px; padding:12px; background:#f5f5f7; border-radius:16px; display:flex; justify-content:space-between; font-weight:600;">
                <span>Toplam Gelir: <span style="color:#34c759;">${formatMoney(aylikGelir)}</span></span>
                <span>Toplam Gider: <span style="color:#ff3b30;">${formatMoney(aylikGider)}</span></span>
                <span>Net: <span>${formatMoney(aylikGelir-aylikGider)}</span></span>
            </div>
        `;
        document.body.appendChild(pdfDiv);
        await html2pdf().from(pdfDiv).set({ margin: 0.5, filename: `mucahitkasa_${getMonthName(year, month)}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' } }).save();
        document.body.removeChild(pdfDiv);
        showToast("PDF hazır");
        showLoading(false);
    };

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    window.closeModal = (id) => { 
        document.getElementById(id).style.display = 'none'; 
        clearModalInputs(id); 
    };
    function clearModalInputs(modalId) {
        if(modalId === 'incomeModal') { document.getElementById('incomeTitle').value = ''; document.getElementById('incomeAmount').value = ''; }
        if(modalId === 'expenseModal') { document.getElementById('expenseTitle').value = ''; document.getElementById('expenseAmount').value = ''; }
        if(modalId === 'borcModal') { document.getElementById('borcKisi').value = ''; document.getElementById('borcMiktar').value = ''; document.getElementById('borcTarih').value = ''; document.getElementById('borcAciklama').value = ''; }
        if(modalId === 'alacakModal') { document.getElementById('alacakKisi').value = ''; document.getElementById('alacakMiktar').value = ''; document.getElementById('alacakTarih').value = ''; document.getElementById('alacakAciklama').value = ''; }
    }
    async function addGeneric(collectionName, data, modalId, successMsg) {
        if(isProcessing) return;
        isProcessing = true;
        showLoading(true);
        try {
            await addDoc(collection(db, collectionName), { ...data, tarih: new Date().toISOString() });
            closeModal(modalId);
            await loadAll();
            showToast(successMsg);
        } catch(err) {
            showToast("Hata: " + err.message, true);
        } finally {
            isProcessing = false;
            showLoading(false);
        }
    }
    document.getElementById('saveIncomeBtn').onclick = () => {
        let baslik = document.getElementById('incomeTitle').value.trim();
        let tutar = parseFloat(document.getElementById('incomeAmount').value);
        if(!baslik || tutar<=0) return showToast("Geçerli bilgi", true);
        addGeneric("mucahit_gelirler", { baslik, kategori: document.getElementById('incomeCat').value, tutar }, "incomeModal", "Gelir eklendi");
    };
    document.getElementById('saveExpenseBtn').onclick = () => {
        let baslik = document.getElementById('expenseTitle').value.trim();
        let tutar = parseFloat(document.getElementById('expenseAmount').value);
        if(!baslik || tutar<=0) return showToast("Geçerli bilgi", true);
        addGeneric("mucahit_giderler", { baslik, kategori: document.getElementById('expenseCat').value, tutar }, "expenseModal", "Gider eklendi");
    };
    document.getElementById('saveBorcBtn').onclick = async () => {
        let kisi = document.getElementById('borcKisi').value.trim();
        let miktar = parseFloat(document.getElementById('borcMiktar').value);
        let tarih = document.getElementById('borcTarih').value;
        if(!kisi || miktar<=0 || !tarih) return showToast("Eksik bilgi", true);
        addGeneric("mucahit_borclar", { kisi, miktar, tarih, aciklama: document.getElementById('borcAciklama').value }, "borcModal", "Borç eklendi");
    };
    document.getElementById('saveAlacakBtn').onclick = async () => {
        let kisi = document.getElementById('alacakKisi').value.trim();
        let miktar = parseFloat(document.getElementById('alacakMiktar').value);
        let tarih = document.getElementById('alacakTarih').value;
        if(!kisi || miktar<=0 || !tarih) return showToast("Eksik bilgi", true);
        addGeneric("mucahit_alacaklar", { kisi, miktar, tarih, aciklama: document.getElementById('alacakAciklama').value }, "alacakModal", "Alacak eklendi");
    };
    function getMonthName(y,m) { return ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"][m]+" "+y; }
    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }
    window.changeMonth = (delta) => { let nm = currentMonth+delta; if(nm<0){nm=11;currentYear--;} if(nm>11){nm=0;currentYear++;} currentMonth=nm; renderDashboard(); };
    document.getElementById('prevMonthBtn').onclick = () => changeMonth(-1);
    document.getElementById('nextMonthBtn').onclick = () => changeMonth(1);
    document.getElementById('searchInput').addEventListener('keyup', () => applyFilterAndRender());
    document.getElementById('openIncomeModal').onclick = () => openModal('incomeModal');
    document.getElementById('openExpenseModal').onclick = () => openModal('expenseModal');
    document.getElementById('openBorcModal').onclick = () => openModal('borcModal');
    document.getElementById('openAlacakModal').onclick = () => openModal('alacakModal');
    document.getElementById('pdfBtn').onclick = () => exportToPDF();
    document.getElementById('logoutBtn').onclick = () => { document.getElementById('loginContainer').style.display = 'flex'; document.getElementById('appContainer').style.display = 'none'; allGelirler=[]; };
    
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            applyFilterAndRender();
        });
    });
    
    // Line period change
    document.querySelectorAll('#linePeriodControl .segment-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#linePeriodControl .segment-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentLinePeriod = btn.dataset.linePeriod;
            updateLineChart();
        });
    });
    
    // Pie period change
    document.querySelectorAll('#piePeriodControl .segment-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#piePeriodControl .segment-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPiePeriod = btn.dataset.piePeriod;
            updatePieChart();
        });
    });
    
    // Modal dışarı tıklama kapatma
    document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', (e) => {
            if(e.target === modal) {
                const modalId = modal.id;
                closeModal(modalId);
            }
        });
    });
    document.querySelectorAll('.modal-close').forEach(btn => {
        btn.addEventListener('click', () => {
            const modalId = btn.getAttribute('data-modal');
            if(modalId) closeModal(modalId);
        });
    });
    
    function setTheme(theme) {
        if(theme === 'dark') { document.body.classList.add('dark'); document.body.classList.remove('light'); }
        else { document.body.classList.add('light'); document.body.classList.remove('dark'); }
        updateCharts();
    }
    document.getElementById('themeToggleBtn').onclick = () => setTheme(document.body.classList.contains('dark') ? 'light' : 'dark');
    if(window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme('dark'); else setTheme('light');
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => setTheme(e.matches ? 'dark' : 'light'));
    
    const savedPin = localStorage.getItem('mucahit_pin');
    if(savedPin) document.getElementById('pinInput').value = savedPin;
    document.getElementById('loginBtn').onclick = () => {
        const pin = document.getElementById('pinInput').value;
        if(pin === "547143614") {
            if(document.getElementById('rememberCheckbox').checked) localStorage.setItem('mucahit_pin', pin);
            else localStorage.removeItem('mucahit_pin');
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            loadAll();
        } else showToast("Hatalı şifre", true);
    };
</script>
</body>
