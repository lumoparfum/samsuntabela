<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* Tüm stiller aynen kaldı (önceki versiyonla birebir aynı, sadece giriş ekranı değişti) */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #f5f5f7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #1c1c1e;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            transition: background 0.2s, color 0.2s;
        }
        body.light { background: #f5f5f7; color: #1c1c1e; }
        body.light .app-card, body.light .kpi-card, body.light .transaction-item, body.light .borc-card, body.light .chart-card, body.light .modal-card { background: #ffffff; border-color: #e9e9ef; }
        body.dark { background: #000000; color: #ffffff; }
        body.dark .app-card, body.dark .kpi-card, body.dark .transaction-item, body.dark .borc-card, body.dark .chart-card, body.dark .modal-card { background: #1c1c1e; border-color: #2c2c2e; }
        body.dark .kpi-title, body.dark .borc-tarih, body.dark .section-title { color: #98989e; }
        body.dark .current-month { color: #ffffff; }
        body.dark .month-panel { background: #1c1c1e; }
        body.dark .form-control { background: #2c2c2e; border-color: #3a3a3c; color: white; }
        body.dark .icon-btn { background: #2c2c2e; border-color: #3a3a3c; color: #ff9f1c; }
        .trans-cat { background: #f2f2f5; padding: 2px 10px; border-radius: 20px; font-size: 0.7rem; display: inline-block; }
        body.dark .trans-cat { background: #2c2c2e; color: #ffffff; }
        .app-container { width: 100%; max-width: 100%; margin: 0; }
        .app-card { border-radius: 28px; margin-bottom: 16px; padding: 16px; }
        .app-header { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 16px; }
        .logo-area h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; background: linear-gradient(135deg, #0A2540, #F5A623); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: center; }
        .header-actions { display: flex; gap: 12px; justify-content: center; }
        .icon-btn { border: 0.5px solid; border-radius: 40px; padding: 8px 14px; font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; background: #ffffff; }
        .month-panel { background: #f9f9fb; border-radius: 60px; padding: 6px 12px; display: flex; justify-content: center; align-items: center; margin-bottom: 16px; }
        .month-nav { display: flex; gap: 20px; align-items: center; }
        .month-nav-btn { background: transparent; border: none; width: 36px; height: 36px; border-radius: 36px; font-size: 1rem; cursor: pointer; color: #007aff; }
        .current-month { font-size: 1.1rem; font-weight: 600; text-align: center; }
        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .kpi-card { border-radius: 24px; padding: 14px; text-align: center; border: 0.5px solid; }
        .kpi-title { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 6px; }
        .kpi-value { font-size: 1.4rem; font-weight: 700; }
        .income-value { color: #34c759; }
        .expense-value { color: #ff3b30; }
        .balance-value { color: #0A2540; }
        body.dark .balance-value { color: #ffffff; }
        .chart-row { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
        .chart-card { border-radius: 28px; padding: 12px; border: 0.5px solid; }
        .section-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        canvas { max-height: 180px; width: 100% !important; }
        .action-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .btn-income, .btn-expense, .btn-borc, .btn-alacak { flex: 1; padding: 12px 0; border-radius: 60px; font-weight: 600; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; border: none; }
        .btn-income { background: #e5f5e8; color: #2c6e3c; }
        .btn-expense { background: #ffe8e8; color: #c41e1e; }
        .btn-borc { background: #fff0e0; color: #cc7b00; }
        .btn-alacak { background: #e0f0ff; color: #0066cc; }
        .borc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .borc-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .borc-card { border-radius: 20px; padding: 12px; border: 0.5px solid; border-left: 4px solid #ff9f1c; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .borc-card.alacak { border-left-color: #34c759; }
        .borc-detay { flex: 2; }
        .borc-title { font-weight: 600; font-size: 0.9rem; }
        .borc-tarih { font-size: 0.7rem; color: #8e8e93; }
        .borc-tutar { font-weight: 700; font-size: 1rem; }
        .btn-ode { background: #ff9f1c; border: none; padding: 8px 14px; border-radius: 30px; color: white; font-weight: 600; font-size: 0.75rem; cursor: pointer; min-width: 85px; white-space: nowrap; }
        .transaction-item { border-radius: 20px; margin-bottom: 8px; border: 0.5px solid; position: relative; overflow: hidden; }
        .transaction-content { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: inherit; width: 100%; transition: transform 0.2s; }
        .swipe-delete { position: absolute; right: 0; top: 0; height: 100%; width: 70px; background: #ff3b30; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; transform: translateX(100%); transition: transform 0.2s; border-radius: 20px; cursor: pointer; }
        .transaction-item.swiped .swipe-delete { transform: translateX(0); }
        .transaction-item.swiped .transaction-content { transform: translateX(-70px); }
        .search-box input { width: 100%; padding: 12px; border-radius: 30px; border: 0.5px solid #e9e9ef; background: #f9f9fb; font-size: 0.9rem; margin-bottom: 12px; }
        .transactions-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .filter-buttons { display: flex; gap: 8px; }
        .filter-btn { background: transparent; border: 0.5px solid #e9e9ef; border-radius: 30px; padding: 6px 12px; font-size: 0.7rem; font-weight: 500; cursor: pointer; }
        body.dark .filter-btn { border-color: #3a3a3c; color: #fff; }
        .filter-btn.active { background: #007aff; color: white; border-color: #007aff; }
        .load-more-btn { background: transparent; border: 0.5px solid #e9e9ef; border-radius: 40px; padding: 10px; width: 100%; text-align: center; font-weight: 600; margin-top: 8px; cursor: pointer; color: #007aff; }
        body.dark .load-more-btn { border-color: #3a3a3c; color: #ff9f1c; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-card { border-radius: 36px; width: 90%; max-width: 380px; padding: 20px; }
        .modal-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { font-size: 0.75rem; font-weight: 500; color: #6c6c70; display: block; margin-bottom: 4px; }
        .form-control { width: 100%; padding: 12px; background: #f9f9fb; border: 0.5px solid #e9e9ef; border-radius: 30px; font-size: 0.9rem; }
        .modal-save { width: 100%; padding: 12px; background: #0A2540; color: white; border: none; border-radius: 60px; font-weight: 600; margin-top: 8px; cursor: pointer; }
        .toast { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1c1c1e; color: white; padding: 12px; border-radius: 40px; text-align: center; z-index: 3000; animation: fadeUp 0.3s; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .remember-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
        .spinner { text-align: center; padding: 20px; color: #8e8e93; }
        .fa-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Login kartı (güncellendi) */
        .login-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        body.dark .login-container { background: #000; }
        .login-card { background: #fff; border-radius: 48px; padding: 40px 30px; width: 90%; max-width: 340px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.05); border: 0.5px solid #e9e9ef; }
        body.dark .login-card { background: #1c1c1e; border-color: #2c2c2e; }
        .login-logo { font-size: 2rem; font-weight: 800; margin-bottom: 30px; background: linear-gradient(135deg,#0A2540,#F5A623); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .login-input { width: 100%; padding: 14px; background: #f9f9fb; border: 0.5px solid #e9e9ef; border-radius: 60px; text-align: center; margin-bottom: 16px; font-size: 1rem; }
        body.dark .login-input { background: #2c2c2e; border-color: #3a3a3c; color: white; }
        .login-btn { width: 100%; padding: 14px; background: #0A2540; color: white; font-weight: 600; border: none; border-radius: 60px; font-size: 1rem; cursor: pointer; margin-bottom: 10px; }
        .login-btn.register { background: #34c759; }
    </style>
</head>
<body class="light">
<!-- GİRİŞ EKRANI (email + şifre) -->
<div id="loginContainer" class="login-container">
    <div class="login-card">
        <div class="login-logo">MÜCAHİT<span style="color:#F5A623;">KASA</span></div>

        <input type="password" id="loginPassword" class="login-input" placeholder="Şifreniz" autocomplete="current-password">

<!-- UYGULAMA ANA BÖLÜMÜ -->
<div id="appContainer" class="app-container" style="display:none">
    <div class="app-card">
        <div class="app-header">
            <div class="logo-area"><h1>MÜCAHİT<span style="color:#F5A623;">KASA</span></h1></div>
            <div class="header-actions">
                <button class="icon-btn" id="themeToggleBtn"><i class="fas fa-moon"></i></button>
                <button class="icon-btn" id="pdfBtn"><i class="fas fa-file-pdf"></i> PDF</button>

        </div>
        <div class="month-panel">
            <div class="month-nav">

                <div class="current-month" id="currentMonthDisplay">Haziran 2026</div>

        <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-title">Bu Ay Gelir</div><div class="kpi-value income-value" id="monthIncome">₺0</div></div>

    <div class="action-buttons">
        <button class="btn-income" id="openIncomeModal"><i class="fas fa-plus-circle"></i> Gelir</button>
        <button class="btn-expense" id="openExpenseModal"><i class="fas fa-minus-circle"></i> Gider</button>
        <button class="btn-borc" id="openBorcModal"><i class="fas fa-hand-holding-usd"></i> Borç</button>

    </div>

    <div class="borc-header">
        <div class="section-title"><i class="fas fa-exchange-alt"></i> Borç & Alacaklar</div>
        <div id="borcOzet" style="font-size:0.7rem;"></div>

    <div id="borcList" class="borc-list">Yükleniyor...</div>

    <div class="search-box"><input type="text" id="searchInput" placeholder="İşlem ara (başlık/kategori)"></div>
    
    <div class="transactions-header">
        <div class="section-title"><i class="fas fa-history"></i> İşlem Geçmişi <span id="transactionCount" style="font-size:0.7rem; margin-left:8px;"></span></div>

            <button class="filter-btn active" data-filter="all">Tümü</button>

<!-- Modallar (öncekiyle aynı) -->
<div id="incomeModal" class="modal"><div class="modal-card"><div class="modal-header"><span>Gelir Ekle</span><span class="modal-close" onclick="closeModal('incomeModal')">&times;</span></div>
    <div class="form-group"><label>Başlık</label><input type="text" id="incomeTitle" class="form-control" placeholder="Tag işi, maaş"></div>
    <div class="form-group"><label>Kategori</label><select id="incomeCat" class="form-control"><option>Tag İşleri</option><option>Maaş</option><option>Serbest İş</option><option>Hediye</option><option>Yatırım</option><option>Diğer</option></select></div>

    <div class="form-group"><label>Kategori</label><select id="expenseCat" class="form-control"><option>Faturalar</option><option>Tag Malzemesi</option><option>Alışveriş</option><option>Yeme/İçme</option><option>Ulaşım</option><option>Sağlık</option><option>Eğlence</option><option>Kira/Aidat</option><option>Borç Ödemesi</option><option>Diğer</option></select></div>
    <div class="form-group"><label>Tutar (₺)</label><input type="number" id="expenseAmount" class="form-control"></div>
    <button class="modal-save" id="saveExpenseBtn">Kaydet</button>
</div></div>

<div id="borcModal" class="modal"><div class="modal-card"><div class="modal-header"><span>Borç Ekle</span><span class="modal-close" onclick="closeModal('borcModal')">&times;</span></div>
    <div class="form-group"><label>Kişi/Kurum</label><input type="text" id="borcKisi" class="form-control"></div>
    <div class="form-group"><label>Miktar (₺)</label><input type="number" id="borcMiktar" class="form-control"></div>
    <div class="form-group"><label>Son Ödeme Tarihi</label><input type="date" id="borcTarih" class="form-control"></div>
    <div class="form-group"><label>Açıklama</label><input type="text" id="borcAciklama" class="form-control"></div>
    <button class="modal-save" id="saveBorcBtn">Ekle</button>
</div></div>

<div id="alacakModal" class="modal"><div class="modal-card"><div class="modal-header"><span>Alacak Ekle</span><span class="modal-close" onclick="closeModal('alacakModal')">&times;</span></div>
    <div class="form-group"><label>Kişi/Kurum</label><input type="text" id="alacakKisi" class="form-control"></div>
    <div class="form-group"><label>Miktar (₺)</label><input type="number" id="alacakMiktar" class="form-control"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAhBlHB0kZRB-IpEIGdHrS7ntzM17YpAWM",
        authDomain: "uzmankasa-94c54.firebaseapp.com",
        projectId: "uzmankasa-94c54",
        storageBucket: "uzmankasa-94c54.firebasestorage.app",
        messagingSenderId: "453163147831",
        appId: "1:453163147831:web:41311f3374b5d95d7115b2"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth();

    let allGelirler = [], allGiderler = [], allBorclar = [], allAlacaklar = [];
    let currentYear = new Date().getFullYear(), currentMonth = new Date().getMonth();
    let chart1 = null, chart2 = null;
    let isProcessing = false;
    let currentFilter = "all";
    let currentDisplayCount = 10;
    let allTransactionsArray = [];
    let filteredTransactionsArray = [];

    // --- Helper fonksiyonlar ---
    function formatDateWithDay(date) {
        const gunler = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
        const d = new Date(date);
        const gunAdi = gunler[d.getDay()];
        return `${d.toLocaleDateString('tr-TR')} ${gunAdi} ${d.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})}`;
    }
    function generateAppleTouchIcon() {
        const canvas = document.createElement('canvas');
        canvas.width = 180;
        canvas.height = 180;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0A2540';
        ctx.fillRect(0, 0, 180, 180);
        ctx.fillStyle = '#F5A623';
        ctx.font = 'bold 100px "Inter"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💰', 90, 90);
        canvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            let link = document.querySelector('link[rel="apple-touch-icon"]');
            if(!link) {
                link = document.createElement('link');
                link.rel = 'apple-touch-icon';
                document.head.appendChild(link);
            }
            link.href = url;
        });
    }
    generateAppleTouchIcon();

    function showToast(msg, err = false) {
        let t = document.createElement('div'); t.className = 'toast'; t.innerText = msg; t.style.background = err ? '#ff3b30' : '#1c1c1e'; document.body.appendChild(t); setTimeout(() => t.remove(), 2500);
    }
    function formatMoney(amt) { return '₺' + amt.toLocaleString('tr-TR'); }

    async function loadAll() {
        try {
            const g1 = await getDocs(query(collection(db, "mucahit_gelirler"), orderBy("tarih", "desc")));
            allGelirler = g1.docs.map(d => ({ id: d.id, ...d.data() }));
            const g2 = await getDocs(query(collection(db, "mucahit_giderler"), orderBy("tarih", "desc")));
            allGiderler = g2.docs.map(d => ({ id: d.id, ...d.data() }));
            const b1 = await getDocs(collection(db, "mucahit_borclar"));
            allBorclar = b1.docs.map(d => ({ id: d.id, ...d.data(), tip: 'borc' }));
            const b2 = await getDocs(collection(db, "mucahit_alacaklar"));
            allAlacaklar = b2.docs.map(d => ({ id: d.id, ...d.data(), tip: 'alacak' }));
            
            allTransactionsArray = [...allGelirler.map(g => ({ ...g, tip: 'gelir', tutar: g.tutar, baslik: g.baslik, kategori: g.kategori, tarih: g.tarih, docId: g.id })),
                                   ...allGiderler.map(g => ({ ...g, tip: 'gider', tutar: g.tutar, baslik: g.baslik, kategori: g.kategori, tarih: g.tarih, docId: g.id }))];
            allTransactionsArray.sort((a,b) => new Date(b.tarih) - new Date(a.tarih));
            renderDashboard();
        } catch(error) {
            showToast("Veri yüklenemedi: " + error.message, true);
        }
    }

    function getCurrentFilterObj() { return { year: currentYear, month: currentMonth }; }

    function renderDashboard() {
        const { year, month } = getCurrentFilterObj();
        let aylikGelir = 0, aylikGider = 0;
        allGelirler.forEach(g => { let d = new Date(g.tarih); if(d.getFullYear()===year && d.getMonth()===month) aylikGelir += g.tutar; });
        allGiderler.forEach(g => { let d = new Date(g.tarih); if(d.getFullYear()===year && d.getMonth()===month) aylikGider += g.tutar; });
        document.getElementById('monthIncome').innerHTML = formatMoney(aylikGelir);
        document.getElementById('monthExpense').innerHTML = formatMoney(aylikGider);
        document.getElementById('monthRemaining').innerHTML = formatMoney(aylikGelir - aylikGider);
        document.getElementById('currentMonthDisplay').innerText = getMonthName(year, month);
        renderBorcList();
        applyFilterAndRender();
        updateCharts();
    }

    function renderBorcList() {
        let html = '';
        let geciken = 0;
        const bugun = new Date();
        [...allBorclar, ...allAlacaklar].forEach(item => {
            const isBorc = item.tip === 'borc';
            const tarih = new Date(item.tarih);
            const gecikti = tarih < bugun;
            if(gecikti && isBorc) geciken++;
            html += `<div class="borc-card ${isBorc ? '' : 'alacak'}">
                <div class="borc-detay">
                    <div class="borc-title">${isBorc ? '🧾 Borç' : '💰 Alacak'} - ${escapeHtml(item.kisi)}</div>
                    <div class="borc-tarih">Son Tarih: ${formatDateWithDay(item.tarih)} ${gecikti ? '⚠️ Gecikti' : ''}</div>
                    <div style="font-size:0.7rem; color:#8e8e93;">${escapeHtml(item.aciklama || '')}</div>
                </div>
                <div class="borc-tutar" style="color:${isBorc ? '#ff3b30' : '#34c759'}">${formatMoney(item.miktar)}</div>
                <button class="btn-ode" data-id="${item.id}" data-tip="${item.tip}" data-miktar="${item.miktar}">${isBorc ? 'Ödendi' : 'Tahsil Edildi'}</button>
            </div>`;
        });
        if(html === '') html = '<div style="text-align:center;padding:20px;">Borç/Alacak yok</div>';
        document.getElementById('borcList').innerHTML = html;
        document.getElementById('borcOzet').innerHTML = `⚠️ ${geciken} gecikmiş borç`;
        document.querySelectorAll('.borc-card .btn-ode').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                if(isProcessing) return;
                isProcessing = true;
                const id = btn.dataset.id;
                const tip = btn.dataset.tip;
                const miktar = parseFloat(btn.dataset.miktar);
                try {
                    if(tip === 'borc') {
                        await addDoc(collection(db, "mucahit_giderler"), { baslik: "Borç Ödemesi", kategori: "Borç Ödemesi", tutar: miktar, tarih: new Date().toISOString() });
                        await deleteDoc(doc(db, "mucahit_borclar", id));
                        showToast("Borç ödendi, gidere eklendi");
                    } else {
                        await addDoc(collection(db, "mucahit_gelirler"), { baslik: "Alacak Tahsilatı", kategori: "Diğer", tutar: miktar, tarih: new Date().toISOString() });
                        await deleteDoc(doc(db, "mucahit_alacaklar", id));
                        showToast("Alacak tahsil edildi, gelire eklendi");
                    }
                    await loadAll();
                } catch(err) {
                    showToast("İşlem başarısız: " + err.message, true);
                } finally {
                    isProcessing = false;
                }
            });
        });
    }

    function applyFilterAndRender() {
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
        filteredTransactionsArray = allTransactionsArray.filter(t => {
            const matchesSearch = t.baslik.toLowerCase().includes(searchTerm) || t.kategori.toLowerCase().includes(searchTerm);
            if(currentFilter === 'gelir') return matchesSearch && t.tip === 'gelir';
            if(currentFilter === 'gider') return matchesSearch && t.tip === 'gider';
            return matchesSearch;
        });
        currentDisplayCount = 10;
        renderTransactionListWithPagination();
    }

    function renderTransactionListWithPagination() {
        const container = document.getElementById('transactionList');
        const loadMoreContainer = document.getElementById('loadMoreContainer');
        const toShow = filteredTransactionsArray.slice(0, currentDisplayCount);
        container.innerHTML = '';
        
        toShow.forEach(t => {
            let dateStr = formatDateWithDay(t.tarih);
            let icon = t.tip === 'gelir' ? '💰' : '💸';
            let itemDiv = document.createElement('div');
            itemDiv.className = 'transaction-item';
            itemDiv.dataset.id = t.docId;
            itemDiv.dataset.tip = t.tip;
            itemDiv.innerHTML = `
                <div class="transaction-content">
                    <div>
                        <div style="font-weight:600;">${icon} ${escapeHtml(t.baslik)}</div>
                        <div><span class="trans-cat">${escapeHtml(t.kategori)}</span></div>
                        <div style="font-size:0.7rem; color:#8e8e93;">${dateStr}</div>
                    </div>
                    <div style="font-weight:700; color:${t.tip === 'gelir' ? '#34c759' : '#ff3b30'}">${t.tip === 'gelir' ? '+' : '-'} ${formatMoney(t.tutar)}</div>
                </div>
                <div class="swipe-delete"><i class="fas fa-trash-alt"></i> Sil</div>
            `;
            let startX = 0, isSwiping = false;
            const handleStart = (clientX) => { startX = clientX; isSwiping = true; };
            const handleMove = (clientX) => {
                if(!isSwiping) return;
                let diff = startX - clientX;
                if(diff > 30 && diff < 100) itemDiv.classList.add('swiped');
                else if(diff < -30) itemDiv.classList.remove('swiped');
            };
            const handleEnd = () => { isSwiping = false; };
            itemDiv.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientX));
            itemDiv.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX));
            itemDiv.addEventListener('touchend', handleEnd);
            itemDiv.addEventListener('mousedown', (e) => handleStart(e.clientX));
            itemDiv.addEventListener('mousemove', (e) => handleMove(e.clientX));
            itemDiv.addEventListener('mouseup', handleEnd);
            
            const deleteBtn = itemDiv.querySelector('.swipe-delete');
            deleteBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if(isProcessing) return;
                isProcessing = true;
                const id = itemDiv.dataset.id;
                const tip = itemDiv.dataset.tip;
                const index = filteredTransactionsArray.findIndex(x => x.docId === id);
                if(index !== -1) filteredTransactionsArray.splice(index, 1);
                const mainIndex = allTransactionsArray.findIndex(x => x.docId === id);
                if(mainIndex !== -1) allTransactionsArray.splice(mainIndex, 1);
                renderTransactionListWithPagination();
                try {
                    if(tip === 'gelir') await deleteDoc(doc(db, "mucahit_gelirler", id));
                    else await deleteDoc(doc(db, "mucahit_giderler", id));
                    showToast("İşlem silindi");
                } catch(err) {
                    showToast("Silme hatası, yeniden dene", true);
                    await loadAll();
                }
                isProcessing = false;
            });
            container.appendChild(itemDiv);
        });
        
        document.getElementById('transactionCount').innerHTML = `${filteredTransactionsArray.length} işlem`;
        loadMoreContainer.innerHTML = '';
        if(currentDisplayCount < filteredTransactionsArray.length) {
            let btn = document.createElement('button');
            btn.innerText = 'Daha Fazla Yükle';
            btn.className = 'load-more-btn';
            btn.onclick = () => {
                currentDisplayCount += 10;
                renderTransactionListWithPagination();
            };
            loadMoreContainer.appendChild(btn);
        }
    }

    function updateCharts() {
        let son6 = [];
        for(let i=5; i>=0; i--) {
            let d = new Date(currentYear, currentMonth - i, 1);
            son6.push({ year: d.getFullYear(), month: d.getMonth() });
        }
        let gelirData = [], giderData = [], labels = [];
        son6.forEach(({year, month}) => {
            let inc=0, exp=0;
            allGelirler.forEach(g => { let d=new Date(g.tarih); if(d.getFullYear()===year && d.getMonth()===month) inc+=g.tutar; });
            allGiderler.forEach(g => { let d=new Date(g.tarih); if(d.getFullYear()===year && d.getMonth()===month) exp+=g.tutar; });
            gelirData.push(inc); giderData.push(exp);
            labels.push(`${month+1}/${year.toString().slice(-2)}`);
        });
        const isDark = document.body.classList.contains('dark');
        const fontColor = isDark ? '#ffffff' : '#1c1c1e';
        const ctx1 = document.getElementById('monthlyChart').getContext('2d');
        if(chart1) chart1.destroy();
        chart1 = new Chart(ctx1, {
            type: 'bar',
            data: { labels, datasets: [{ label: 'Gelir', data: gelirData, backgroundColor: '#34c759' }, { label: 'Gider', data: giderData, backgroundColor: '#ff3b30' }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: fontColor } } } }
        });
        
        const { year, month } = getCurrentFilterObj();
        let catMap = new Map();
        allGiderler.forEach(g => {
            let d = new Date(g.tarih);
            if(d.getFullYear()===year && d.getMonth()===month) {
                catMap.set(g.kategori, (catMap.get(g.kategori)||0) + g.tutar);
            }
        });
        const ctx2 = document.getElementById('categoryChart').getContext('2d');
        if(chart2) chart2.destroy();
        chart2 = new Chart(ctx2, {
            type: 'pie',
            data: { labels: Array.from(catMap.keys()), datasets: [{ data: Array.from(catMap.values()), backgroundColor: ['#ff9f1c','#1e3a5f','#34c759','#ff3b30','#af52de','#ff9500'] }] },
            options: { plugins: { legend: { labels: { color: fontColor } } } }
        });
    }

    window.exportToPDF = async () => {
        const { year, month } = getCurrentFilterObj();
        let aylikGelir=0, aylikGider=0;
        let aylikIslemler = [];
        allGelirler.forEach(g => { let d=new Date(g.tarih); if(d.getFullYear()===year && d.getMonth()===month) { aylikGelir += g.tutar; aylikIslemler.push({...g, tip:'Gelir'}); } });
        allGiderler.forEach(g => { let d=new Date(g.tarih); if(d.getFullYear()===year && d.getMonth()===month) { aylikGider += g.tutar; aylikIslemler.push({...g, tip:'Gider'}); } });
        aylikIslemler.sort((a,b)=>new Date(b.tarih)-new Date(a.tarih));
        
        const pdfDiv = document.createElement('div');
        pdfDiv.style.padding = '16px';
        pdfDiv.style.fontFamily = 'Inter, sans-serif';
        pdfDiv.style.backgroundColor = '#fff';
        pdfDiv.style.color = '#000';
        pdfDiv.innerHTML = `
            <h1 style="font-size:24px; font-weight:800; text-align:center;">MÜCAHİTKASA RAPORU</h1>
            <p style="text-align:center; color:#666;">${getMonthName(year, month)}</p>
            <div style="display:flex; gap:12px; margin:16px 0;">
                <div style="flex:1; background:#f5f5f7; padding:12px; border-radius:20px;"><div>Gelir</div><div style="font-size:20px; color:#34c759;">${formatMoney(aylikGelir)}</div></div>
                <div style="flex:1; background:#f5f5f7; padding:12px; border-radius:20px;"><div>Gider</div><div style="font-size:20px; color:#ff3b30;">${formatMoney(aylikGider)}</div></div>
                <div style="flex:1; background:#f5f5f7; padding:12px; border-radius:20px;"><div>Kalan</div><div style="font-size:20px;">${formatMoney(aylikGelir-aylikGider)}</div></div>
            </div>
            <table style="width:100%; border-collapse:collapse; font-size:11px;">
                <thead><tr style="background:#f2f2f2;"><th style="padding:8px;">Tarih</th><th>Tip</th><th>Başlık</th><th>Kategori</th><th>Tutar</th></tr></thead>
                <tbody>${aylikIslemler.map(t => {
                    const rowBg = t.tip === 'Gelir' ? '#f0fff0' : '#fff0f0';
                    return `<tr style="background:${rowBg};">
                        <td style="padding:6px;">${formatDateWithDay(t.tarih)}</td>
                        <td>${t.tip}</td>
                        <td>${escapeHtml(t.baslik)}</td>
                        <td>${escapeHtml(t.kategori)}</td>
                        <td style="text-align:right;">${formatMoney(t.tutar)}</td>
                    </tr>`;
                }).join('')}</tbody>
            </table>
            <div style="margin-top:16px; padding:12px; background:#f5f5f7; border-radius:16px; display:flex; justify-content:space-between; font-weight:600;">
                <span>Toplam Gelir: <span style="color:#34c759;">${formatMoney(aylikGelir)}</span></span>
                <span>Toplam Gider: <span style="color:#ff3b30;">${formatMoney(aylikGider)}</span></span>
                <span>Net: <span>${formatMoney(aylikGelir-aylikGider)}</span></span>
            </div>
        `;
        document.body.appendChild(pdfDiv);
        html2pdf().from(pdfDiv).set({ margin: 0.5, filename: `mucahitkasa_${getMonthName(year, month)}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' } }).save().then(() => { document.body.removeChild(pdfDiv); showToast("PDF hazır"); });
    };

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    window.closeModal = (id) => { 
        document.getElementById(id).style.display = 'none'; 
        clearModalInputs(id); 
    };
    function clearModalInputs(modalId) {
        if(modalId === 'incomeModal') { document.getElementById('incomeTitle').value = ''; document.getElementById('incomeAmount').value = ''; }
        if(modalId === 'expenseModal') { document.getElementById('expenseTitle').value = ''; document.getElementById('expenseAmount').value = ''; }
        if(modalId === 'borcModal') { document.getElementById('borcKisi').value = ''; document.getElementById('borcMiktar').value = ''; document.getElementById('borcTarih').value = ''; document.getElementById('borcAciklama').value = ''; }
        if(modalId === 'alacakModal') { document.getElementById('alacakKisi').value = ''; document.getElementById('alacakMiktar').value = ''; document.getElementById('alacakTarih').value = ''; document.getElementById('alacakAciklama').value = ''; }
    }
    async function addGeneric(collectionName, data, modalId, successMsg) {
        if(isProcessing) return;
        isProcessing = true;
        try {
            await addDoc(collection(db, collectionName), { ...data, tarih: new Date().toISOString() });
            closeModal(modalId);
            await loadAll();
            showToast(successMsg);
        } catch(err) {
            showToast("Hata: " + err.message, true);
        } finally {
            isProcessing = false;
        }
    }
    document.getElementById('saveIncomeBtn').onclick = () => {
        let baslik = document.getElementById('incomeTitle').value.trim();
        let tutar = parseFloat(document.getElementById('incomeAmount').value);
        if(!baslik || tutar<=0) return showToast("Geçerli bilgi", true);
        addGeneric("mucahit_gelirler", { baslik, kategori: document.getElementById('incomeCat').value, tutar }, "incomeModal", "Gelir eklendi");
    };
    document.getElementById('saveExpenseBtn').onclick = () => {
        let baslik = document.getElementById('expenseTitle').value.trim();
        let tutar = parseFloat(document.getElementById('expenseAmount').value);
        if(!baslik || tutar<=0) return showToast("Geçerli bilgi", true);
        addGeneric("mucahit_giderler", { baslik, kategori: document.getElementById('expenseCat').value, tutar }, "expenseModal", "Gider eklendi");
    };
    document.getElementById('saveBorcBtn').onclick = async () => {
        let kisi = document.getElementById('borcKisi').value.trim();
        let miktar = parseFloat(document.getElementById('borcMiktar').value);
        let tarih = document.getElementById('borcTarih').value;
        if(!kisi || miktar<=0 || !tarih) return showToast("Eksik bilgi", true);
        addGeneric("mucahit_borclar", { kisi, miktar, tarih, aciklama: document.getElementById('borcAciklama').value }, "borcModal", "Borç eklendi");
    };
    document.getElementById('saveAlacakBtn').onclick = async () => {
        let kisi = document.getElementById('alacakKisi').value.trim();
        let miktar = parseFloat(document.getElementById('alacakMiktar').value);
        let tarih = document.getElementById('alacakTarih').value;
        if(!kisi || miktar<=0 || !tarih) return showToast("Eksik bilgi", true);
        addGeneric("mucahit_alacaklar", { kisi, miktar, tarih, aciklama: document.getElementById('alacakAciklama').value }, "alacakModal", "Alacak eklendi");
    };
    function getMonthName(y,m) { return ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"][m]+" "+y; }
    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }
    window.changeMonth = (delta) => { let nm = currentMonth+delta; if(nm<0){nm=11;currentYear--;} if(nm>11){nm=0;currentYear++;} currentMonth=nm; renderDashboard(); };
    document.getElementById('prevMonthBtn').onclick = () => changeMonth(-1);
    document.getElementById('nextMonthBtn').onclick = () => changeMonth(1);
    document.getElementById('searchInput').addEventListener('keyup', () => applyFilterAndRender());
    document.getElementById('openIncomeModal').onclick = () => openModal('incomeModal');
    document.getElementById('openExpenseModal').onclick = () => openModal('expenseModal');
    document.getElementById('openBorcModal').onclick = () => openModal('borcModal');
    document.getElementById('openAlacakModal').onclick = () => openModal('alacakModal');
    document.getElementById('pdfBtn').onclick = () => exportToPDF();
    
    // Çıkış işlemi (Authentication ile)
    document.getElementById('logoutBtn').onclick = async () => {
        try {
            await signOut(auth);
            showToast("Çıkış yapıldı.");
        } catch(error) {
            showToast("Çıkış hatası: " + error.message, true);
        }
    };
    
    // Filtre butonları
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            applyFilterAndRender();
        });
    });
    
    // Tema ayarları
    function setTheme(theme) {
        if(theme === 'dark') { document.body.classList.add('dark'); document.body.classList.remove('light'); }
        else { document.body.classList.add('light'); document.body.classList.remove('dark'); }
        updateCharts();
    }
    document.getElementById('themeToggleBtn').onclick = () => setTheme(document.body.classList.contains('dark') ? 'light' : 'dark');
    if(window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme('dark'); else setTheme('light');
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => setTheme(e.matches ? 'dark' : 'light'));
    
    // --- AUTHENTICATION (Email/Password) ---
    window.login = async () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) { showToast("Lütfen e-posta ve şifre girin", true); return; }
        try {
            await signInWithEmailAndPassword(auth, email, password);
            showToast("Giriş başarılı!");
        } catch (error) {
            let msg = error.message;
            if (error.code === 'auth/user-not-found') msg = "Bu e-postaya ait hesap yok.";
            if (error.code === 'auth/wrong-password') msg = "Şifre hatalı.";
            showToast(msg, true);
        }
    };
    
    window.register = async () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) { showToast("Lütfen e-posta ve şifre girin", true); return; }
        try {
            await createUserWithEmailAndPassword(auth, email, password);
            showToast("Kayıt başarılı! Hoş geldiniz.");
        } catch (error) {
            let msg = error.message;
            if (error.code === 'auth/email-already-in-use') msg = "Bu e-posta zaten kullanılıyor.";
            if (error.code === 'auth/weak-password') msg = "Şifre en az 6 karakter olmalı.";
            showToast(msg, true);
        }
    };
    
    document.getElementById('loginBtn').onclick = () => login();
    document.getElementById('registerBtn').onclick = () => register();
    
    // Oturum durumunu dinle
    onAuthStateChanged(auth, (user) => {
        const loginContainer = document.getElementById('loginContainer');
        const appContainer = document.getElementById('appContainer');
        if (user) {
            loginContainer.style.display = 'none';
            appContainer.style.display = 'block';
            loadAll();
        } else {
            loginContainer.style.display = 'flex';
            appContainer.style.display = 'none';
            allTransactionsArray = [];
        }
    });
</script>
</body>
</html>
