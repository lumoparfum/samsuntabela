<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MücahitKasa">
    <title>MücahitKasa | Şahsi Bütçe</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230A2540'/%3E%3Ctext x='50' y='67' font-size='60' text-anchor='middle' fill='%23F5A623' font-family='Arial, sans-serif' font-weight='bold'%3E💰%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230A2540'/%3E%3Ctext x='50' y='67' font-size='60' text-anchor='middle' fill='%23F5A623' font-family='Arial, sans-serif' font-weight='bold'%3E💰%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f5f5f7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            color: #1c1c1e;
            padding: 0;
            margin: 0;
            transition: background 0.2s, color 0.2s;
        }

        /* Tam mobil odaklı, masaüstünde de maksimum genişlik sınırı yok */
        .app-container {
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            border-radius: 0;
            box-shadow: none;
        }

        /* Karanlık tema */
        body.dark {
            background: #000000;
            color: #ffffff;
        }

        body.dark .app-container {
            background: #000000;
        }

        body.dark .app-header {
            border-bottom-color: #2c2c2e;
        }

        body.dark .icon-btn {
            background: #1c1c1e;
            border-color: #3a3a3c;
            color: #F5A623;
        }

        body.dark .logout-btn {
            color: #ff453a;
        }

        body.dark .month-panel {
            background: #1c1c1e;
        }

        body.dark .current-month {
            color: #ffffff;
        }

        body.dark .kpi-card, body.dark .chart-card, body.dark .transaction-item, body.dark .modal-card, body.dark .borc-card {
            background: #1c1c1e;
            border-color: #2c2c2e;
        }

        body.dark .kpi-title, body.dark .trans-cat, body.dark .trans-date, body.dark .borc-tarih {
            color: #98989e;
        }

        body.dark .btn-income {
            background: #1e3a2a;
            color: #34c759;
        }

        body.dark .btn-expense {
            background: #3a1e1e;
            color: #ff453a;
        }

        body.dark .btn-borc {
            background: #3a2e1e;
            color: #F5A623;
        }

        body.dark .btn-alacak {
            background: #1e2a3a;
            color: #0a84ff;
        }

        body.dark .form-control {
            background: #2c2c2e;
            border-color: #3a3a3c;
            color: white;
        }

        body.dark .login-container {
            background: #000000;
        }

        body.dark .login-card {
            background: #1c1c1e;
            border-color: #2c2c2e;
        }

        body.dark .modal-card {
            background: #1c1c1e;
        }

        body.dark .borc-card.alacak {
            border-left-color: #34c759;
        }

        body.dark .borc-card {
            border-left-color: #F5A623;
        }

        /* Header */
        .app-header {
            padding: 20px 20px 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 0.5px solid #e9e9ef;
            background: inherit;
        }

        .logo-area h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #0A2540, #F5A623);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: #ffffff;
            border: 0.5px solid #e9e9ef;
            color: #0A2540;
            padding: 8px 16px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .logout-btn {
            color: #ff3b30;
        }

        .theme-toggle {
            width: 40px;
            justify-content: center;
        }

        /* Ay paneli */
        .month-panel {
            background: #f9f9fb;
            margin: 16px 20px;
            padding: 8px 16px;
            border-radius: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .month-nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .month-nav-btn {
            background: transparent;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            color: #0A2540;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .current-month {
            font-size: 1.2rem;
            font-weight: 600;
            color: #000;
        }

        /* KPI kartları - mobilde 2 sütun */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 0 20px 24px 20px;
        }

        .kpi-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 0.5px solid #e9e9ef;
            display: flex;
            flex-direction: column;
        }

        .kpi-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 600;
            color: #8e8e93;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .income-value {
            color: #34c759;
        }

        .expense-value {
            color: #ff3b30;
        }

        .balance-value {
            color: #0A2540;
        }

        .limit-value {
            color: #F5A623;
        }

        /* Grafikler */
        .chart-row {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 0 20px 24px 20px;
        }

        .chart-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 16px;
            border: 0.5px solid #e9e9ef;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        canvas {
            max-height: 200px;
            width: 100% !important;
        }

        /* Butonlar */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin: 0 20px 24px 20px;
            flex-wrap: wrap;
        }

        .btn-income, .btn-expense, .btn-borc, .btn-alacak {
            flex: 1;
            padding: 12px 8px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            border: none;
            transition: 0.1s;
        }

        .btn-income {
            background: #e5f5e8;
            color: #2c6e3c;
        }

        .btn-expense {
            background: #ffe8e8;
            color: #c41e1e;
        }

        .btn-borc {
            background: #fff0e0;
            color: #cc7b00;
        }

        .btn-alacak {
            background: #e0f0ff;
            color: #0066cc;
        }

        /* Borç/Alacak listesi */
        .borc-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 8px 20px 12px 20px;
        }

        .borc-list {
            margin: 0 20px 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .borc-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 0.5px solid #e9e9ef;
            border-left: 4px solid #F5A623;
        }

        .borc-card.alacak {
            border-left-color: #34c759;
        }

        .borc-detay {
            flex: 2;
        }

        .borc-title {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .borc-tarih {
            font-size: 0.7rem;
            color: #8e8e93;
            margin-top: 2px;
        }

        .borc-aciklama {
            font-size: 0.7rem;
            color: #8e8e93;
        }

        .borc-tutar {
            font-weight: 700;
            font-size: 1rem;
        }

        .btn-ode {
            background: #F5A623;
            border: none;
            padding: 8px 14px;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .btn-ode:disabled {
            opacity: 0.5;
            transform: none;
        }

        /* İşlem listesi */
        .search-box {
            margin: 0 20px 16px 20px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 30px;
            border: 0.5px solid #e9e9ef;
            background: #f9f9fb;
            font-size: 0.9rem;
            outline: none;
        }

        .transactions-header {
            display: flex;
            justify-content: space-between;
            margin: 8px 20px 12px 20px;
        }

        .transaction-list {
            margin: 0 20px 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .transaction-item {
            background: #ffffff;
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 0.5px solid #e9e9ef;
            border-left-width: 4px;
        }

        .trans-detail {
            flex: 1;
        }

        .trans-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .trans-cat {
            font-size: 0.7rem;
            background: #f2f2f5;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 30px;
            margin-top: 4px;
        }

        .trans-date {
            font-size: 0.65rem;
            color: #8e8e93;
            margin-top: 4px;
        }

        .trans-amount {
            font-weight: 700;
            font-size: 1rem;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 36px;
            width: 90%;
            max-width: 400px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #6c6c70;
            display: block;
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: #f9f9fb;
            border: 0.5px solid #e9e9ef;
            border-radius: 30px;
            font-size: 0.9rem;
            outline: none;
        }

        .modal-save {
            width: 100%;
            padding: 14px;
            background: #0A2540;
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 16px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #1c1c1e;
            color: white;
            padding: 12px 20px;
            border-radius: 60px;
            text-align: center;
            z-index: 3000;
            animation: slideUp 0.2s ease;
            font-size: 0.85rem;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Giriş ekranı */
        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-card {
            background: #ffffff;
            border-radius: 48px;
            padding: 40px 30px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            border: 0.5px solid #e9e9ef;
        }

        .login-logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #0A2540, #F5A623);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .login-input {
            width: 100%;
            padding: 14px 18px;
            background: #f9f9fb;
            border: 0.5px solid #e9e9ef;
            border-radius: 60px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #0A2540;
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="loginContainer" class="login-container">
    <div class="login-card">
        <div class="login-logo">MÜCAHİTKASA</div>
        <input type="password" id="pinInput" class="login-input" placeholder="Şifre" autocomplete="off">
        <button id="loginBtn" class="login-btn">Giriş Yap</button>
    </div>
</div>

<div id="appContainer" class="app-container" style="display:none">
    <div class="app-header">
        <div class="logo-area"><h1>MÜCAHİTKASA</h1></div>
        <div class="header-actions">
            <button class="icon-btn theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
            <button class="icon-btn" onclick="exportToPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
            <button class="icon-btn logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="month-panel">
        <button class="month-nav-btn" id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
        <div class="current-month" id="currentMonthDisplay">Haziran 2026</div>
        <button class="month-nav-btn" id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
    </div>

    <div class="kpi-grid" id="kpiGrid">
        <div class="kpi-card"><div class="kpi-title">Bu Ay Gelir</div><div class="kpi-value income-value" id="monthIncome">₺0</div></div>
        <div class="kpi-card"><div class="kpi-title">Bu Ay Gider</div><div class="kpi-value expense-value" id="monthExpense">₺0</div></div>
        <div class="kpi-card"><div class="kpi-title">Kalan Bütçe</div><div class="kpi-value balance-value" id="monthRemaining">₺0</div></div>
        <div class="kpi-card"><div class="kpi-title">Toplam Varlık</div><div class="kpi-value limit-value" id="totalWealth">₺0</div></div>
        <div class="kpi-card"><div class="kpi-title">Toplam Borç</div><div class="kpi-value expense-value" id="totalBorc">₺0</div></div>
        <div class="kpi-card"><div class="kpi-title">Toplam Alacak</div><div class="kpi-value income-value" id="totalAlacak">₺0</div></div>
    </div>

    <div class="chart-row">
        <div class="chart-card"><div class="section-title"><i class="fas fa-chart-line"></i> Aylık Gelir/Gider</div><canvas id="monthlyChart"></canvas></div>
        <div class="chart-card"><div class="section-title"><i class="fas fa-chart-pie"></i> Gider Kategorileri</div><canvas id="categoryChart"></canvas></div>
    </div>

    <div class="action-buttons">
        <button class="btn-income" id="btnIncomeModal"><i class="fas fa-plus-circle"></i> Gelir</button>
        <button class="btn-expense" id="btnExpenseModal"><i class="fas fa-minus-circle"></i> Gider</button>
        <button class="btn-borc" id="btnBorcModal"><i class="fas fa-hand-holding-usd"></i> Borç</button>
        <button class="btn-alacak" id="btnAlacakModal"><i class="fas fa-money-bill-wave"></i> Alacak</button>
    </div>

    <div class="borc-header">
        <div class="section-title" style="margin:0"><i class="fas fa-exchange-alt"></i> Borç & Alacaklar</div>
        <div id="borcOzet" style="font-size:0.7rem; color:#F5A623;"></div>
    </div>
    <div id="borcList" class="borc-list">Yükleniyor...</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="İşlem ara (başlık, kategori)..." onkeyup="filterTransactions()">
    </div>
    <div class="transactions-header">
        <div class="section-title" style="margin:0"><i class="fas fa-history"></i> İşlem Geçmişi</div>
        <div id="transactionCount">0 işlem</div>
    </div>
    <div id="transactionList" class="transaction-list">Yükleniyor...</div>
</div>

<!-- Modallar -->
<div id="incomeModal" class="modal"><div class="modal-card"><div class="modal-header"><span>Gelir Ekle</span><span class="modal-close" onclick="closeModal('incomeModal')">&times;</span></div>
    <div class="form-group"><label>Başlık</label><input type="text" id="incomeTitle" class="form-control" placeholder="Tag işi, maaş..."></div>
    <div class="form-group"><label>Kategori</label><select id="incomeCat" class="form-control"><option>Tag İşleri</option><option>Maaş</option><option>Serbest İş</option><option>Hediye</option><option>Yatırım/Kripto</option><option>Diğer</option></select></div>
    <div class="form-group"><label>Tutar (₺)</label><input type="number" id="incomeAmount" class="form-control" step="any"></div>
    <button class="modal-save" id="saveIncomeBtn">Kaydet</button>
</div></div>

<div id="expenseModal" class="modal"><div class="modal-card"><div class="modal-header"><span>Gider Ekle</span><span class="modal-close" onclick="closeModal('expenseModal')">&times;</span></div>
    <div class="form-group"><label>Başlık</label><input type="text" id="expenseTitle" class="form-control" placeholder="Kahve, fatura..."></div>
    <div class="form-group"><label>Kategori</label><select id="expenseCat" class="form-control"><option>Faturalar</option><option>Tag Malzemesi</option><option>Alışveriş</option><option>Yeme/İçme</option><option>Ulaşım</option><option>Sağlık</option><option>Eğlence</option><option>Kira/Aidat</option><option>Borç Ödemesi</option><option>Diğer</option></select></div>
    <div class="form-group"><label>Tutar (₺)</label><input type="number" id="expenseAmount" class="form-control" step="any"></div>
    <button class="modal-save" id="saveExpenseBtn">Kaydet</button>
</div></div>

<div id="borcModal" class="modal"><div class="modal-card"><div class="modal-header"><span>Borç Ekle</span><span class="modal-close" onclick="closeModal('borcModal')">&times;</span></div>
    <div class="form-group"><label>Kişi / Kurum</label><input type="text" id="borcKisi" class="form-control" placeholder="Ali'ye borcum"></div>
    <div class="form-group"><label>Miktar (₺)</label><input type="number" id="borcMiktar" class="form-control" step="any"></div>
    <div class="form-group"><label>Son Ödeme Tarihi</label><input type="date" id="borcTarih" class="form-control"></div>
    <div class="form-group"><label>Açıklama</label><input type="text" id="borcAciklama" class="form-control"></div>
    <button class="modal-save" id="saveBorcBtn">Borç Ekle</button>
</div></div>

<div id="alacakModal" class="modal"><div class="modal-card"><div class="modal-header"><span>Alacak Ekle</span><span class="modal-close" onclick="closeModal('alacakModal')">&times;</span></div>
    <div class="form-group"><label>Kişi / Kurum</label><input type="text" id="alacakKisi" class="form-control" placeholder="Veli bana borçlu"></div>
    <div class="form-group"><label>Miktar (₺)</label><input type="number" id="alacakMiktar" class="form-control" step="any"></div>
    <div class="form-group"><label>Tahmini Tahsilat Tarihi</label><input type="date" id="alacakTarih" class="form-control"></div>
    <div class="form-group"><label>Açıklama</label><input type="text" id="alacakAciklama" class="form-control"></div>
    <button class="modal-save" id="saveAlacakBtn">Alacak Ekle</button>
</div></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAhBlHB0kZRB-IpEIGdHrS7ntzM17YpAWM",
        authDomain: "uzmankasa-94c54.firebaseapp.com",
        projectId: "uzmankasa-94c54",
        storageBucket: "uzmankasa-94c54.firebasestorage.app",
        messagingSenderId: "453163147831",
        appId: "1:453163147831:web:41311f3374b5d95d7115b2"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allGelirler = [], allGiderler = [], allBorclar = [], allAlacaklar = [];
    let currentYear = new Date().getFullYear(), currentMonth = new Date().getMonth();
    let chart1 = null, chart2 = null;
    let isLoading = false;

    function showToast(msg, isError = false) {
        const t = document.createElement('div'); t.className = 'toast'; t.style.background = isError ? '#ff3b30' : '#1c1c1e'; t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2500);
    }

    function formatMoney(amt) { return '₺' + amt.toLocaleString('tr-TR'); }

    async function loadAll() {
        if(isLoading) return;
        isLoading = true;
        try {
            const gelirSnap = await getDocs(query(collection(db, "mucahit_gelirler"), orderBy("tarih", "desc")));
            allGelirler = gelirSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            const giderSnap = await getDocs(query(collection(db, "mucahit_giderler"), orderBy("tarih", "desc")));
            allGiderler = giderSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            const borcSnap = await getDocs(collection(db, "mucahit_borclar"));
            allBorclar = borcSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            const alacakSnap = await getDocs(collection(db, "mucahit_alacaklar"));
            allAlacaklar = alacakSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderDashboard();
        } catch(e) { showToast("Veri yüklenemedi", true); }
        isLoading = false;
    }

    function renderDashboard() {
        const { year, month } = { year: currentYear, month: currentMonth };
        let aylikGelir = 0, aylikGider = 0;
        allGelirler.forEach(g => { let d = new Date(g.tarih); if(d.getFullYear()===year && d.getMonth()===month) aylikGelir += g.tutar; });
        allGiderler.forEach(g => { let d = new Date(g.tarih); if(d.getFullYear()===year && d.getMonth()===month) aylikGider += g.tutar; });
        let toplamVarlik = 0;
        allGelirler.forEach(g => toplamVarlik += g.tutar);
        allGiderler.forEach(g => toplamVarlik -= g.tutar);
        let toplamBorclar = allBorclar.reduce((s,b) => s + b.miktar, 0);
        let toplamAlacaklar = allAlacaklar.reduce((s,a) => s + a.miktar, 0);
        let netVarlik = toplamVarlik - toplamBorclar + toplamAlacaklar;
        document.getElementById('monthIncome').innerHTML = formatMoney(aylikGelir);
        document.getElementById('monthExpense').innerHTML = formatMoney(aylikGider);
        document.getElementById('monthRemaining').innerHTML = formatMoney(aylikGelir - aylikGider);
        document.getElementById('totalWealth').innerHTML = formatMoney(netVarlik);
        document.getElementById('totalBorc').innerHTML = formatMoney(toplamBorclar);
        document.getElementById('totalAlacak').innerHTML = formatMoney(toplamAlacaklar);
        renderBorcList();
        renderTransactionList();
        updateCharts();
        document.getElementById('currentMonthDisplay').innerText = getMonthName(currentYear, currentMonth);
    }

    function renderBorcList() {
        let html = '';
        let gecikmis = 0;
        const bugun = new Date();
        [...allBorclar, ...allAlacaklar].forEach(item => {
            const isBorc = !!item.kisi && !item.alacakMi; // basit ayrım: borclar koleksiyonunda tip yok, alacaklar ayrı
            // Daha net: allBorclar için borç, allAlacaklar için alacak
        });
        // Borçlar
        allBorclar.forEach(b => {
            const tarih = new Date(b.tarih);
            const gecikti = tarih < bugun;
            if(gecikti) gecikmis++;
            html += `<div class="borc-card">
                <div class="borc-detay">
                    <div class="borc-title">🧾 Borç - ${escapeHtml(b.kisi)}</div>
                    <div class="borc-tarih">Son Tarih: ${tarih.toLocaleDateString('tr-TR')} ${gecikti ? '⚠️ Gecikmiş' : ''}</div>
                    <div class="borc-aciklama">${escapeHtml(b.aciklama || '')}</div>
                </div>
                <div class="borc-tutar" style="color:#ff3b30;">${formatMoney(b.miktar)}</div>
                <button class="btn-ode" data-id="${b.id}" data-miktar="${b.miktar}" data-tip="borc">Ödendi</button>
            </div>`;
        });
        // Alacaklar
        allAlacaklar.forEach(a => {
            const tarih = new Date(a.tarih);
            const gecikti = tarih < bugun;
            if(gecikti) gecikmis++;
            html += `<div class="borc-card alacak">
                <div class="borc-detay">
                    <div class="borc-title">💰 Alacak - ${escapeHtml(a.kisi)}</div>
                    <div class="borc-tarih">Tahmini Tarih: ${tarih.toLocaleDateString('tr-TR')} ${gecikti ? '⚠️ Gecikmiş' : ''}</div>
                    <div class="borc-aciklama">${escapeHtml(a.aciklama || '')}</div>
                </div>
                <div class="borc-tutar" style="color:#34c759;">${formatMoney(a.miktar)}</div>
                <button class="btn-ode" data-id="${a.id}" data-miktar="${a.miktar}" data-tip="alacak">Tahsil Edildi</button>
            </div>`;
        });
        if(html === '') html = '<div style="text-align:center;padding:20px;">Borç veya alacak bulunmuyor</div>';
        document.getElementById('borcList').innerHTML = html;
        document.getElementById('borcOzet').innerHTML = gecikmis > 0 ? `${gecikmis} gecikmiş işlem` : '✅ Güncel';
        // Buton olaylarını ata (çift tıklama korumalı)
        document.querySelectorAll('.btn-ode').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                if(btn.disabled) return;
                btn.disabled = true;
                const id = btn.dataset.id;
                const miktar = parseFloat(btn.dataset.miktar);
                const tip = btn.dataset.tip;
                if(tip === 'borc') {
                    await addDoc(collection(db, "mucahit_giderler"), { baslik: "Borç Ödemesi", kategori: "Borç Ödemesi", tutar: miktar, tarih: new Date().toISOString() });
                    await deleteDoc(doc(db, "mucahit_borclar", id));
                    showToast("Borç ödendi, gidere eklendi");
                } else {
                    await addDoc(collection(db, "mucahit_gelirler"), { baslik: "Alacak Tahsilatı", kategori: "Diğer", tutar: miktar, tarih: new Date().toISOString() });
                    await deleteDoc(doc(db, "mucahit_alacaklar", id));
                    showToast("Alacak tahsil edildi, gelire eklendi");
                }
                await loadAll();
                btn.disabled = false;
            });
        });
    }

    function renderTransactionList() {
        let all = [...allGelirler.map(g => ({ ...g, tip: 'gelir' })), ...allGiderler.map(g => ({ ...g, tip: 'gider' }))];
        all.sort((a,b) => new Date(b.tarih) - new Date(a.tarih));
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
        let filtered = all.filter(t => t.baslik.toLowerCase().includes(searchTerm) || t.kategori.toLowerCase().includes(searchTerm));
        let html = '';
        filtered.forEach(t => {
            let dateObj = new Date(t.tarih);
            let dateStr = dateObj.toLocaleDateString('tr-TR') + ' ' + dateObj.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
            html += `<div class="transaction-item" style="border-left-color: ${t.tip === 'gelir' ? '#34c759' : '#ff3b30'}">
                <div class="trans-detail">
                    <div class="trans-title">${escapeHtml(t.baslik)}</div>
                    <div><span class="trans-cat">${escapeHtml(t.kategori)}</span></div>
                    <div class="trans-date">${dateStr}</div>
                </div>
                <div class="trans-amount" style="color:${t.tip === 'gelir' ? '#34c759' : '#ff3b30'}">${t.tip === 'gelir' ? '+' : '-'} ${formatMoney(t.tutar)}</div>
            </div>`;
        });
        document.getElementById('transactionList').innerHTML = html || '<div style="text-align:center;padding:20px;">İşlem yok</div>';
        document.getElementById('transactionCount').innerHTML = filtered.length + ' işlem';
    }

    window.filterTransactions = () => renderTransactionList();

    function updateCharts() {
        let son6 = [];
        for(let i=5; i>=0; i--) {
            let d = new Date(currentYear, currentMonth - i, 1);
            son6.push({ year: d.getFullYear(), month: d.getMonth() });
        }
        let gelirData = [], giderData = [], labels = [];
        son6.forEach(({year, month}) => {
            let inc=0, exp=0;
            allGelirler.forEach(g => { let d=new Date(g.tarih); if(d.getFullYear()===year && d.getMonth()===month) inc+=g.tutar; });
            allGiderler.forEach(g => { let d=new Date(g.tarih); if(d.getFullYear()===year && d.getMonth()===month) exp+=g.tutar; });
            gelirData.push(inc); giderData.push(exp);
            labels.push(`${month+1}/${year}`);
        });
        const isDark = document.body.classList.contains('dark');
        const textColor = isDark ? '#fff' : '#1c1c1e';
        if(chart1) chart1.destroy();
        chart1 = new Chart(document.getElementById('monthlyChart'), {
            type: 'bar',
            data: { labels, datasets: [{ label: 'Gelir', data: gelirData, backgroundColor: '#34c759' }, { label: 'Gider', data: giderData, backgroundColor: '#ff3b30' }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: textColor } } }, scales: { x: { ticks: { color: textColor } }, y: { ticks: { color: textColor } } } }
        });
        let catMap = new Map();
        allGiderler.forEach(g => { catMap.set(g.kategori, (catMap.get(g.kategori)||0) + g.tutar); });
        if(chart2) chart2.destroy();
        chart2 = new Chart(document.getElementById('categoryChart'), {
            type: 'pie',
            data: { labels: Array.from(catMap.keys()), datasets: [{ data: Array.from(catMap.values()), backgroundColor: ['#F5A623','#0A2540','#34c759','#ff3b30','#af52de','#ff9500','#5e5ce0'] }] },
            options: { plugins: { legend: { labels: { color: textColor } } } }
        });
    }

    // Modal yardımcıları ve çift tıklama korumalı ekleme
    window.openModal = (id) => document.getElementById(id).style.display = 'flex';
    window.closeModal = (id) => {
        document.getElementById(id).style.display = 'none';
        // butonları resetle
    };

    async function addWithGuard(modalId, saveBtnId, callback) {
        const btn = document.getElementById(saveBtnId);
        if(btn.disabled) return;
        btn.disabled = true;
        await callback();
        btn.disabled = false;
        closeModal(modalId);
    }

    document.getElementById('saveIncomeBtn').onclick = async () => {
        await addWithGuard('incomeModal', 'saveIncomeBtn', async () => {
            const baslik = document.getElementById('incomeTitle').value.trim();
            const tutar = parseFloat(document.getElementById('incomeAmount').value);
            if(!baslik || tutar<=0) throw showToast('Geçerli bilgi girin', true);
            await addDoc(collection(db, "mucahit_gelirler"), { baslik, kategori: document.getElementById('incomeCat').value, tutar, tarih: new Date().toISOString() });
            document.getElementById('incomeTitle').value = '';
            document.getElementById('incomeAmount').value = '';
            await loadAll();
            showToast('Gelir eklendi');
        });
    };
    document.getElementById('saveExpenseBtn').onclick = async () => {
        await addWithGuard('expenseModal', 'saveExpenseBtn', async () => {
            const baslik = document.getElementById('expenseTitle').value.trim();
            const tutar = parseFloat(document.getElementById('expenseAmount').value);
            if(!baslik || tutar<=0) throw showToast('Geçerli bilgi girin', true);
            await addDoc(collection(db, "mucahit_giderler"), { baslik, kategori: document.getElementById('expenseCat').value, tutar, tarih: new Date().toISOString() });
            document.getElementById('expenseTitle').value = '';
            document.getElementById('expenseAmount').value = '';
            await loadAll();
            showToast('Gider eklendi');
        });
    };
    document.getElementById('saveBorcBtn').onclick = async () => {
        await addWithGuard('borcModal', 'saveBorcBtn', async () => {
            const kisi = document.getElementById('borcKisi').value.trim();
            const miktar = parseFloat(document.getElementById('borcMiktar').value);
            const tarih = document.getElementById('borcTarih').value;
            if(!kisi || miktar<=0 || !tarih) throw showToast('Eksik bilgi', true);
            await addDoc(collection(db, "mucahit_borclar"), { kisi, miktar, tarih, aciklama: document.getElementById('borcAciklama').value, eklenme: new Date().toISOString() });
            document.getElementById('borcKisi').value = '';
            document.getElementById('borcMiktar').value = '';
            document.getElementById('borcTarih').value = '';
            document.getElementById('borcAciklama').value = '';
            await loadAll();
            showToast('Borç eklendi');
        });
    };
    document.getElementById('saveAlacakBtn').onclick = async () => {
        await addWithGuard('alacakModal', 'saveAlacakBtn', async () => {
            const kisi = document.getElementById('alacakKisi').value.trim();
            const miktar = parseFloat(document.getElementById('alacakMiktar').value);
            const tarih = document.getElementById('alacakTarih').value;
            if(!kisi || miktar<=0 || !tarih) throw showToast('Eksik bilgi', true);
            await addDoc(collection(db, "mucahit_alacaklar"), { kisi, miktar, tarih, aciklama: document.getElementById('alacakAciklama').value, eklenme: new Date().toISOString() });
            document.getElementById('alacakKisi').value = '';
            document.getElementById('alacakMiktar').value = '';
            document.getElementById('alacakTarih').value = '';
            document.getElementById('alacakAciklama').value = '';
            await loadAll();
            showToast('Alacak eklendi');
        });
    };

    document.getElementById('btnIncomeModal').onclick = () => openModal('incomeModal');
    document.getElementById('btnExpenseModal').onclick = () => openModal('expenseModal');
    document.getElementById('btnBorcModal').onclick = () => openModal('borcModal');
    document.getElementById('btnAlacakModal').onclick = () => openModal('alacakModal');

    window.exportToPDF = () => {
        const element = document.getElementById('appContainer').cloneNode(true);
        element.style.backgroundColor = '#ffffff';
        element.style.color = '#000000';
        element.querySelectorAll('.modal, .toast').forEach(el => el.remove());
        const opt = { margin: [0.5, 0.5, 0.5, 0.5], filename: `mucahitkasa_${getMonthName(currentYear, currentMonth)}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, letterRendering: true }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } };
        html2pdf().set(opt).from(element).save().then(() => showToast('PDF raporu hazır')).catch(() => showToast('PDF hatası', true));
    };

    function getMonthName(y,m) { return ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"][m]+" "+y; }
    function escapeHtml(s) { return s?.replace(/[&<>]/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m]; }) || ''; }

    window.changeMonth = (delta) => { let nm = currentMonth+delta; if(nm<0){nm=11;currentYear--;} if(nm>11){nm=0;currentYear++;} currentMonth=nm; renderDashboard(); };
    document.getElementById('prevMonthBtn').onclick = () => changeMonth(-1);
    document.getElementById('nextMonthBtn').onclick = () => changeMonth(1);

    window.toggleTheme = () => {
        document.body.classList.toggle('dark');
        updateCharts();
    };
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { if(e.matches) document.body.classList.add('dark'); else document.body.classList.remove('dark'); updateCharts(); });
    if(window.matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add('dark');

    document.getElementById('loginBtn').onclick = () => {
        if(document.getElementById('pinInput').value === "mucahit2026") {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            loadAll();
        } else showToast("Hatalı şifre!", true);
    };
    window.logout = () => { document.getElementById('loginContainer').style.display = 'flex'; document.getElementById('appContainer').style.display = 'none'; };
</script>
</body>
</html>
